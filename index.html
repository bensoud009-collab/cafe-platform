<style>
/* ============================ نظام التصميم ============================ */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --line:#e4e8f0;
  --text:#1e2532; --muted:#6b7280; --brand:#6366f1; --brand-2:#818cf8;
  --green:#16a34a; --red:#e5484d; --amber:#e08a0b; --blue:#3b82f6;
  --radius:16px; --shadow:0 6px 22px rgba(30,41,59,.08);
  font-family:"Segoe UI",system-ui,-apple-system,"Tahoma",sans-serif;
}
html[data-mode="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --text:#e8eaed; --muted:#9aa3b2;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
/* أيقونات بدون لون (رمادي) */
html[data-icons="mono"] .nav-item .ic,
html[data-icons="mono"] .card > div[style*="font-size:30px"],
html[data-icons="mono"] .card > div[style*="font-size:26px"],
html[data-icons="mono"] .kpi .l{ filter:grayscale(1) opacity(.7); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:15px}
body{-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--brand-2);text-decoration:none}
button{font-family:inherit}
.hidden{display:none !important}
.muted{color:var(--muted)}
.center{display:flex;align-items:center;justify-content:center}

/* عناصر عامة */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:10px;
  padding:10px 16px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--text);
  border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px;outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.green{background:rgba(63,185,132,.15);color:var(--green)}
.tag.red{background:rgba(229,100,95,.15);color:var(--red)}
.tag.amber{background:rgba(224,165,75,.15);color:var(--amber)}

table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.3px}
tbody tr:hover{background:var(--surface-2)}

/* شاشة الدخول */
#loginScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 70% -10%,rgba(99,102,241,.10),transparent)}
.login-box{width:100%;max-width:400px}
.brand-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}

/* التخطيط الرئيسي */
.layout{display:flex;min-height:100%}
.sidebar{width:250px;background:var(--surface);border-left:1px solid var(--line);
  padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-2);color:var(--brand-2)}
.nav-item .ic{width:20px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);gap:12px}
.content{padding:24px;max-width:1200px;width:100%}
.page-title{margin-bottom:20px}
.page-title h2{font-size:22px}
.page-title p{color:var(--muted);margin:4px 0 0;font-size:14px}

/* بطاقات المؤشرات */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .v{font-size:26px;font-weight:800;margin-top:6px}
.kpi .l{color:var(--muted);font-size:13px}

/* المصفوفة (الصلاحيات) */
.matrix{overflow:auto}
.matrix th,.matrix td{text-align:center;padding:8px}
.matrix td:first-child,.matrix th:first-child{text-align:right}

/* المودال */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .body{padding:20px}
.modal .foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}

/* التوست */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);min-width:240px}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}

.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.review-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.review-row b{color:var(--brand-2)}
.photo-prev{margin-top:8px;border-radius:10px;max-height:180px;border:1px solid var(--line)}

@media(max-width:820px){
  .sidebar{position:fixed;right:-260px;z-index:40;transition:.2s} .sidebar.open{right:0}
  .content{padding:16px}
}
.hamb{display:none} @media(max-width:820px){.hamb{display:inline-flex}}
</style>
</head>

      </div>
    </aside>
    <div class="main">
      <div class="topbar">

        <button class="btn ghost sm" id="homeBtn" title="الرئيسية" onclick="navHome()" style="display:none;font-size:13px;padding:5px 8px">🏠</button>

    </div>

function L(s){ if(LANG!=="en"||s==null) return s; const k=(""+s).trim(); return EN[k]||s; }
// ترجمة عناصر الصفحة تلقائياً (النصوص المطابقة في القاموس)
function translateTree(root){
  if(LANG!=="en"||!root) return;
  try{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{ const raw=n.nodeValue; if(!raw) return; const key=raw.trim(); if(key && EN[key]) n.nodeValue=raw.replace(key,EN[key]); });
    root.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(inp=>{ const k=(inp.getAttribute("placeholder")||"").trim(); if(EN[k]) inp.setAttribute("placeholder",EN[k]); });
  }catch(e){}
}
function setLang(l){
  LANG=l; try{ localStorage.setItem("cafe_lang",l); }catch(e){}
  const dir=(LANGS.find(x=>x.k===l)||{}).dir||"rtl";
  document.documentElement.lang=l; document.documentElement.dir=dir;
  applyLoginLang(); renderLangSwitchers();
  if(state.user){ buildShell(); if(state.role==="super"){renderSuperNav();} else {renderCompanyNav();} if(state.current==="__home__"){ renderCardsHome(); } else if(state.current) openPage(state.current,true); }
}
function renderLangSwitchers(){
  ["loginLangs","navLangs"].forEach(id=>{ const w=document.getElementById(id); if(!w) return; w.innerHTML="";
    LANGS.forEach(l=>{ const b=document.createElement("button"); b.className="btn sm"+(LANG===l.k?" primary":""); b.textContent=l.n; b.style.padding="4px 10px"; b.onclick=()=>setLang(l.k); w.appendChild(b); });
  });
}

// ===== أدوات الاشتراك =====
// يحوّل قيمة تاريخ (Timestamp أو نص أو Date) إلى كائن Date
function toDate(v){ if(!v) return null; if(v.toDate) return v.toDate(); const d=new Date(v); return isNaN(d)?null:d; }
// تاريخ انتهاء الاشتراك
function subEndDate(cdata){ const s=cdata&&cdata.subscription; if(!s) return null; return toDate(s.endsAt); }
// كم يوم باقٍ (سالب = منتهٍ)
function subDaysLeft(cdata){ const e=subEndDate(cdata); if(!e) return null; return Math.ceil((e-new Date())/(1000*60*60*24)); }
function subExpired(cdata){ const d=subDaysLeft(cdata); return d!==null && d<0; }

auth.onAuthStateChanged(async user=>{
  if(!user){ state.user=null; show("loginScreen"); applyCompanyBranding(); return; }
  state.user=user;
  show("bootScreen");
  try{
    // 1) وثيقة الربط العليا: users/{uid} => {role, companyId}
    let mapSnap = await db.collection("users").doc(user.uid).get();

    // Bootstrap مالك المنصة
    if(!mapSnap.exists && SUPER_ADMIN_EMAILS.includes((user.email||"").toLowerCase())){
      await db.collection("users").doc(user.uid).set({role:"super",companyId:null,name:"مالك المنصة",createdAt:now()});
      mapSnap = await db.collection("users").doc(user.uid).get();
    }
    if(!mapSnap.exists){ toast("لا يوجد حساب مرتبط بهذا المستخدم","err"); return doLogout(); }

    const map=mapSnap.data();
    state.role=map.role;

    if(map.role==="super"){
      state.companyId=null; state.profile={name:map.name||"مالك المنصة",permissions:{}};
      state.companyName="لوحة مالك المنصة";
      buildShell(); renderSuperNav(); openPage("super_companies");
    }else{
      state.companyId=map.companyId;
      const [companyDoc,profDoc]=await Promise.all([cRef().get(),cRef().collection("users").doc(user.uid).get()]);
      if(!companyDoc.exists){ toast("الشركة غير موجودة","err"); return doLogout(); }
      const cdata=companyDoc.data();
      // فحص انتهاء الاشتراك عند الدخول → إيقاف تلقائي
      if(subExpired(cdata) && cdata.status!=="suspended"){
        try{ await cRef().update({status:"suspended"}); }catch(e){}
        cdata.status="suspended";
      }
      if(cdata.status==="suspended"){ toast("انتهى اشتراك الشركة أو تم إيقافه، راجع الإدارة","err"); return doLogout(); }
      state.companyName=cdata.name;
      state.profile=profDoc.exists?profDoc.data():{name:user.email,role:map.role,permissions:{}};
      // فحص إيقاف حساب الموظف
      if(state.profile.accountActive===false){ toast("حسابك موقوف، راجع صاحب الشركة","err"); return doLogout(); }
      applyTheme(cdata.theme);
      buildShell(); renderCompanyNav();
      if(cardsMode()) renderCardsHome(); else openPage("dashboard");
    }
    logAction("login");
    show("appScreen");
  }catch(e){ console.error(e); toast("خطأ أثناء تحميل الحساب","err"); }
});

// مولّد كلمة مرور عشوائية قوية
function randomPassword(){
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ", b="abcdefghijkmnpqrstuvwxyz", n="23456789", s="!@#$%*";
  const all=a+b+n+s; let p=a[Math.floor(Math.random()*a.length)]+b[Math.floor(Math.random()*b.length)]+n[Math.floor(Math.random()*n.length)]+s[Math.floor(Math.random()*s.length)];
  for(let i=0;i<6;i++) p+=all[Math.floor(Math.random()*all.length)];
  return p.split("").sort(()=>Math.random()-0.5).join("");
}

// حذف الشركة وكل مجموعاتها الفرعية
async function deleteCompanyDeep(id){
  const ref=db.collection("companies").doc(id);
  const subs=["branches","users","dailyClosings","auditLog"];
  for(const sub of subs){
    const snap=await ref.collection(sub).get();
    // حذف على دفعات
    const docs=snap.docs;
    for(let i=0;i<docs.length;i+=400){
      const batch=db.batch();
      docs.slice(i,i+400).forEach(d=>{
        batch.delete(d.ref);
        if(sub==="users") batch.delete(db.collection("users").doc(d.id)); // إزالة الربط العلوي
      });
      await batch.commit();
    }
  }
  await ref.delete();
}

function slugify(s){ return (s||"").toString().trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function companyLink(slug){ return location.origin+location.pathname+"?c="+slug; }

async function createCompany(){
  const name=$("ncName").value.trim(), owner=$("ncOwner").value.trim(), email=$("ncEmail").value.trim().toLowerCase(), phone=$("ncPhone").value.trim();
  const slug=slugify($("ncSlug").value), pass=$("ncPass").value, start=new Date($("ncStart").value), months=parseInt($("ncMonths").value)||1;
  if(!name||!email){toast("أدخل اسم الشركة وبريد صاحبها","err");return false;}
  if(!slug){toast("أدخل اسم الرابط (إنجليزي)","err");return false;}
  if(!pass||pass.length<6){toast("كلمة المرور ٦ أحرف على الأقل (أو ولّدها 🎲)","err");return false;}
  // تأكد أن اسم الرابط غير مستخدم
  const dup=await db.collection("companies").where("slug","==",slug).limit(1).get();
  if(!dup.empty){toast("اسم الرابط مستخدم، اختر غيره","err");return false;}
  const code="C"+Math.random().toString(36).slice(2,7).toUpperCase();
  const end=new Date(isNaN(start)?new Date():start); end.setMonth(end.getMonth()+months);
  try{
    const cred=await secondaryAuth.createUserWithEmailAndPassword(email,pass);
    const ownerUid=cred.user.uid;
    await secondaryAuth.signOut();
    const compRef=db.collection("companies").doc();
    await compRef.set({name,slug,code,ownerName:owner||("صاحب "+name),ownerEmail:email,ownerPhone:phone,ownerUid,status:"active",theme:"gold",
      subscription:{plan:"monthly",months,startsAt:(isNaN(start)?new Date():start).toISOString(),endsAt:end.toISOString(),active:true},
      createdAt:now(), createdBy:state.user.uid});
    await db.collection("users").doc(ownerUid).set({role:"owner",companyId:compRef.id,name:owner||("صاحب الشركة "+name),createdAt:now()});
    await compRef.collection("users").doc(ownerUid).set({name:owner||"صاحب الشركة",email,phone,role:"owner",permissions:fullPermissions(),createdAt:now()});
    // بطاقة عامة للهوية على شاشة الدخول
    await db.collection("publicCompanies").doc(slug).set({name,theme:"gold"}).catch(()=>{});
    logAction("create_company",name);
    closeModal();
    openModal("تم إنشاء الشركة ✅",
      "<div class='review-row'><span>الشركة</span><b>"+esc(name)+"</b></div>"+
      "<div class='review-row'><span>رابط الشركة</span><b style='direction:ltr'>"+esc(companyLink(slug))+"</b></div>"+
      "<div class='review-row'><span>كود الشركة</span><b>"+code+"</b></div>"+
      "<div class='review-row'><span>البريد</span><b>"+esc(email)+"</b></div>"+
      "<div class='review-row'><span>كلمة المرور</span><b>"+esc(pass)+"</b></div>"+
      "<div class='review-row'><span>انتهاء الاشتراك</span><b>"+end.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn")+"</b></div>"+
      "<p class='muted' style='margin-top:14px;font-size:13px'>سلّم الرابط والبيانات لصاحب الشركة.</p>",
      "تم", ()=>true, true);
    return false;
  }catch(e){
    console.error(e);
    toast(e.code==="auth/email-already-in-use"?"البريد مستخدم مسبقاً":"تعذّر إنشاء الشركة","err");
    return false;
  }
}

// نطاق الشهر الحالي/الماضي كنصوص YYYY-MM-DD
function monthRange(offset){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+(offset||0));
  const start=d.toISOString().slice(0,10);
  const n=new Date(d); n.setMonth(n.getMonth()+1);
  const next=n.toISOString().slice(0,10);
  return {start,next};
}

  $("cmpBtn").onclick=()=>saveDashPrefs({compare:!compare,cards});
  if(!dashReorder){
    c.querySelectorAll(".kpi[data-w]").forEach(el=>{ el.onclick=()=>openPage(DASH_WIDGETS[el.dataset.w].page); });
  }else{
    c.querySelectorAll(".dmove").forEach(b=>b.onclick=()=>{
      const i=parseInt(b.dataset.i), dir=parseInt(b.dataset.dir), j=i+dir;
      if(j<0||j>=cards.length) return; const nc=cards.slice(); const t=nc[i];nc[i]=nc[j];nc[j]=t;
      saveDashPrefs({compare,cards:nc});
    });
    c.querySelectorAll(".drm").forEach(b=>b.onclick=()=>saveDashPrefs({compare,cards:cards.filter(x=>x!==b.dataset.rm)}));
  }

  // ===== تغذية البيانات حسب البطاقات المختارة =====
  const cur=monthRange(0), prev=monthRange(-1);
  const needCur = compare || cards.some(k=>["sales_month","closings_month","avg_closing"].includes(k));
  if(needCur){
    cRef().collection("dailyClosings").where("date",">=",cur.start).where("date","<",cur.next).onSnapshot(s=>{
      let sum=0,count=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; sum+=Number(x.actualSales)||0;count++;});
      if($("w_sales_month"))$("w_sales_month").textContent=money(sum);
      if($("w_closings_month"))$("w_closings_month").textContent=count;
      if($("w_avg_closing"))$("w_avg_closing").textContent=money(count?sum/count:0);
      window.__curMonthSales=sum; if(compare) updateDelta();
    },()=>{});
  }
  if(compare || cards.includes("prev_month_sales")){
    cRef().collection("dailyClosings").where("date",">=",prev.start).where("date","<",prev.next).onSnapshot(s=>{
      let sum=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; sum+=Number(x.actualSales)||0;});
      window.__prevMonthSales=sum;
      if($("w_prev_month_sales"))$("w_prev_month_sales").textContent=money(sum);
      if(compare) updateDelta();
    },()=>{});
  }
  if(cards.includes("branches_count")){
    cRef().collection("branches").onSnapshot(s=>{if($("w_branches_count"))$("w_branches_count").textContent=s.size;},()=>{});
  }
  if(cards.includes("users_count")){
    cRef().collection("employees").onSnapshot(s=>{if($("w_users_count"))$("w_users_count").textContent=s.size;},()=>{});
  }
  if(cards.includes("invoices_count")||cards.includes("invoices_total")){
    cRef().collection("invoices").where("date",">=",cur.start).where("date","<",cur.next).onSnapshot(s=>{
      let total=0,count=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; total+=Number(x.total)||0;count++;});
      if($("w_invoices_count"))$("w_invoices_count").textContent=count;
      if($("w_invoices_total"))$("w_invoices_total").textContent=money(total);
    },()=>{});
  }
  if(cards.includes("inventory_count")||cards.includes("inventory_value")||cards.includes("inventory_low")){
    cRef().collection("products").onSnapshot(s=>{
      let val=0,low=0; s.forEach(d=>{const x=d.data();val+=(Number(x.price)||0)*(Number(x.qty)||0); if((Number(x.min)||0)>0 && (Number(x.qty)||0)<=(Number(x.min)||0)) low++;});
      if($("w_inventory_count"))$("w_inventory_count").textContent=s.size;
      if($("w_inventory_value"))$("w_inventory_value").textContent=money(val);
      if($("w_inventory_low"))$("w_inventory_low").textContent=low;
    },()=>{});
  }
}

// حساب وعرض نسبة التغيّر عن الشهر الماضي
function updateDelta(){
  const el=$("salesDelta"); if(!el) return;
  const cur=window.__curMonthSales, prev=window.__prevMonthSales;
  if(cur==null||prev==null) return;
  if(prev===0){ el.textContent=cur>0?"▲ جديد هذا الشهر":"—"; el.style.color="var(--green)"; return; }
  const pct=((cur-prev)/prev)*100;
  const up=pct>=0;
  el.textContent=(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"% عن الشهر الماضي";
  el.style.color=up?"var(--green)":"var(--red)";
}

// بطاقة تأكيد مؤقتة تظهر للموظف بعد الإرسال وتختفي بعد 5 دقائق
function showEmployeeConfirmation(){
  const wrap=$("empTempWrap"); if(!wrap) return;
  const hint=$("empHint"); if(hint) hint.classList.add("hidden");
  const card=el("div","card");
  card.style.borderColor="var(--green)";
  const until=Date.now()+5*60*1000;
  card.innerHTML="<div style='display:flex;align-items:center;gap:10px'><span style='font-size:22px'>✅</span>"+
    "<div><div style='font-weight:700'>تم إرسال الإقفال بنجاح</div>"+
    "<div class='muted' style='font-size:13px'>سُجّل الإقفال وأُرسل للإدارة. هذا التأكيد يختفي خلال <b class='cd'>5:00</b></div></div></div>";
  wrap.prepend(card);
  const cd=card.querySelector(".cd");
  const timer=setInterval(()=>{
    const left=Math.max(0,Math.round((until-Date.now())/1000));
    const m=Math.floor(left/60), s=String(left%60).padStart(2,"0");
    if(cd) cd.textContent=m+":"+s;
    if(left<=0){ clearInterval(timer); card.style.transition=".4s"; card.style.opacity="0";
      setTimeout(()=>{ card.remove(); if(hint && !wrap.children.length) hint.classList.remove("hidden"); },400); }
  },1000);
}

function reviewClosing(){
  const g=id=>$(id)?$(id).value:"";
  const branchSel=$("clBranch"); const branchName=branchSel&&branchSel.selectedOptions[0]?branchSel.selectedOptions[0].textContent:"";
  const cash=parseFloat(g("clCash"))||0, mada=parseFloat(g("clMada"))||0, visa=parseFloat(g("clVisa"))||0, mastercard=parseFloat(g("clMaster"))||0;
  const paySum=cash+mada+visa+mastercard;
  const data={branchId:branchSel?branchSel.value:"",branchName,
    actualSales:paySum, systemSales:parseFloat(g("clSystem"))||0,
    cash, mada, visa, mastercard};
  const file=$("clPhoto").files[0];
  if(!data.branchId){toast("اختر الفرع","err");return false;}
  if(!g("clSystem")){toast("أدخل مبيعات النظام","err");return false;}
  if(paySum<=0){toast("أدخل طرق الدفع (الكاش/الشبكة)","err");return false;}
  const diff=data.actualSales-data.systemSales;
  // شاشة المراجعة قبل الإرسال
  if(!canApproveSales()){
    openModal("تأكيد الإرسال",
      "<div class='review-row'><span>الفرع</span><b>"+esc(branchName)+"</b></div>"+
      "<p class='muted' style='margin-top:12px;font-size:14px'>تأكّد من صحة البيانات قبل الإرسال. تُسجّل تلقائياً بالتاريخ والوقت واسمك وتُرسل للإدارة.</p>",
      "إرسال الإقفال", ()=>submitClosing(data,file));
    return false;
  }
  openModal("مراجعة الإقفال",
    "<div class='review-row'><span>الفرع</span><b>"+esc(branchName)+"</b></div>"+
    "<div class='review-row'><span>المبيعات الفعلية</span><b>"+money(data.actualSales)+"</b></div>"+
    "<div class='review-row'><span>مبيعات النظام</span><b>"+money(data.systemSales)+"</b></div>"+
    "<div class='review-row'><span>الفرق (فعلي − نظام)</span><b style='color:"+(diff===0?"var(--green)":"var(--amber)")+"'>"+money(diff)+"</b></div>"+
    "<div class='review-row'><span>الكاش / مدى / فيزا / ماستر</span><b>"+money(data.cash)+" · "+money(data.mada)+" · "+money(data.visa)+" · "+money(data.mastercard)+"</b></div>"+
    "<div class='review-row'><span>مجموع طرق الدفع</span><b style='color:"+(Math.abs(paySum-data.actualSales)<0.01?"var(--green)":"var(--red)")+"'>"+money(paySum)+"</b></div>"+
    "<p class='muted' style='margin-top:10px;font-size:13px'>التاريخ والوقت واسم المُرسِل تُسجّل تلقائياً."+(file?" أرفقت الصورة ✅":" (بدون صورة)")+"</p>",
    "اعتماد الإرسال", ()=>submitClosing(data,file));
  return false;
}

async function submitClosing(data,file){
  try{
    const ref=cRef().collection("dailyClosings").doc();
    let photoUrl="", photoPath="";
    // الصورة اختيارية: نرفعها فقط إذا وُجدت وكانت خدمة Storage مفعّلة
    if(file){
      try{
        photoPath="companies/"+state.companyId+"/closings/"+ref.id+".jpg";
        const snap=await storage.ref(photoPath).put(file);
        photoUrl=await snap.ref.getDownloadURL();
      }catch(err){
        console.warn("تعذّر رفع الصورة (Storage غير مفعّل) — سيُحفظ الإقفال بدون صورة",err);
        photoUrl=""; photoPath="";
        toast("حُفظ الإقفال بدون صورة (خدمة الصور غير مفعّلة)","");
      }
    }
    await ref.set({...data, photoUrl, photoPath,
      date:new Date().toISOString().slice(0,10),
      employeeUid:state.user.uid, employeeName:state.profile.name||state.user.email,
      status:"pending", createdAt:now()});
    logAction("submit_closing",data.date+" / "+data.branchName);
    toast("تم إرسال الإقفال بنجاح","ok");
    return true;
  }catch(e){console.error(e);toast("تعذّر الإرسال","err");return false;}
}

function collectInvoice(){
  const rows=[...document.querySelectorAll("#invItems .inv-item")];
  const items=[]; let total=0;
  for(const r of rows){
    const name=r.querySelector(".inv-name").value.trim();
    const value=parseFloat(r.querySelector(".inv-val").value)||0;
    const qty=parseFloat(r.querySelector(".inv-qty").value)||0;
    if(!name||value<=0||qty<=0) return {error:true};
    items.push({name,value,qty,lineTotal:value*qty}); total+=value*qty;
  }
  return {items,total,
    supplier:$("invSupplier")?$("invSupplier").value.trim():"",
    supplierPhone:$("invSupPhone")?$("invSupPhone").value.trim():""};
}

function reviewInvoice(){
  const data=collectInvoice();
  if(data.error||!data.items.length){toast("أكمل بيانات كل منتج (اسم، قيمة، كمية)","err");return false;}
  const file=$("invPhoto")?$("invPhoto").files[0]:null;
  data._file=file;
  // الموظف: تأكيد بلا أرقام
  if(invoiceEmployeeView()){
    openModal("تأكيد الفاتورة",
      "<div class='review-row'><span>عدد المنتجات</span><b>"+data.items.length+"</b></div>"+
      "<p class='muted' style='margin-top:12px;font-size:14px'>تأكّد من البيانات قبل الحفظ. تُسجّل تلقائياً بالتاريخ والوقت واسمك.</p>",
      "حفظ الفاتورة", ()=>submitInvoice(data));
    return false;
  }
  // المالك/المدير: تفاصيل كاملة
  openModal("مراجعة الفاتورة",
    data.items.map(it=>"<div class='review-row'><span>"+esc(it.name)+" ("+it.value+"×"+it.qty+")</span><b>"+money(it.lineTotal)+"</b></div>").join("")+
    "<div class='review-row'><span>المورد</span><b>"+(esc(data.supplier)||"—")+(data.supplierPhone?" · "+esc(data.supplierPhone):"")+"</b></div>"+
    "<div class='review-row'><span>الإجمالي</span><b style='color:var(--brand-2)'>"+money(data.total)+"</b></div>"+
    "<p class='muted' style='margin-top:10px;font-size:13px'>"+(file?"أرفقت الصورة ✅":"بدون صورة")+"</p>",
    "حفظ الفاتورة", ()=>submitInvoice(data));
  return false;
}

async function submitInvoice(data){
  try{
    const ref=cRef().collection("invoices").doc();
    let photoUrl="",photoPath="";
    if(data._file){
      try{ photoPath="companies/"+state.companyId+"/invoices/"+ref.id+".jpg";
        const snap=await storage.ref(photoPath).put(data._file); photoUrl=await snap.ref.getDownloadURL();
      }catch(err){ photoUrl="";photoPath=""; toast("حُفظت الفاتورة بدون صورة (خدمة الصور غير مفعّلة)",""); }
    }
    await ref.set({
      items:data.items.map(({name,value,qty,lineTotal})=>({name,value,qty,lineTotal})),
      total:data.total, supplier:data.supplier||"", supplierPhone:data.supplierPhone||"",
      photoUrl, photoPath, date:new Date().toISOString().slice(0,10),
      employeeUid:state.user.uid, employeeName:state.profile.name||state.user.email,
      createdBy:state.user.uid, createdByName:state.profile.name||state.user.email,
      status:"pending", createdAt:now()
    });
    logAction("add_invoice",(data.items[0]?data.items[0].name:"")+(data.items.length>1?" +"+(data.items.length-1):""));
    toast("تم إرسال الفاتورة بنجاح","ok");
    return true;
  }catch(e){console.error(e);toast("تعذّر حفظ الفاتورة","err");return false;}
}

// بطاقة تأكيد مؤقتة للموظف (5 دقائق) بعد حفظ الفاتورة
function showInvoiceConfirmation(){
  const wrap=$("invTempWrap"); if(!wrap) return;
  const hint=$("invHint"); if(hint) hint.classList.add("hidden");
  const card=el("div","card"); card.style.borderColor="var(--green)";
  const until=Date.now()+5*60*1000;
  card.innerHTML="<div style='display:flex;align-items:center;gap:10px'><span style='font-size:22px'>✅</span>"+
    "<div><div style='font-weight:700'>تم حفظ الفاتورة</div>"+
    "<div class='muted' style='font-size:13px'>سُجّلت وأُرسلت للإدارة. يختفي هذا التأكيد خلال <b class='cd'>5:00</b></div></div></div>";
  wrap.prepend(card);
  const cd=card.querySelector(".cd");
  const t=setInterval(()=>{ const left=Math.max(0,Math.round((until-Date.now())/1000));
    const m=Math.floor(left/60),s=String(left%60).padStart(2,"0"); if(cd)cd.textContent=m+":"+s;
    if(left<=0){clearInterval(t);card.style.transition=".4s";card.style.opacity="0";
      setTimeout(()=>{card.remove(); if(hint&&!wrap.children.length)hint.classList.remove("hidden");},400);}
  },1000);
}

async function invCountForm(c){
  const snap=await cRef().collection("products").orderBy("name").get();
  if(snap.empty){toast("لا توجد منتجات للجرد","err");return;}
  const prods=[]; snap.forEach(d=>prods.push({id:d.id,...d.data()}));
  const rows=prods.map((p,i)=>"<tr><td><b>"+esc(p.name)+"</b> <span class='muted'>"+esc(p.unit||"")+"</span></td><td class='muted'>"+(Number(p.qty)||0)+"</td><td><input class='input cntv' data-i='"+i+"' type='number' inputmode='decimal' style='width:90px;padding:6px' placeholder='الفعلي'></td></tr>").join("");
  openModal("إضافة جرد",
    "<div class='muted' style='font-size:13px;margin-bottom:8px'>أدخل الكمية الفعلية لكل منتج.</div>"+
    "<table><thead><tr><th>المنتج</th><th>بالنظام</th><th>الفعلي</th></tr></thead><tbody>"+rows+"</tbody></table>",
    "حفظ الجرد", async ()=>{
      const results=[]; let shortageVal=0;
      document.querySelectorAll("#modalRoot .cntv").forEach(inp=>{ const i=+inp.dataset.i; const v=inp.value.trim(); if(v==="")return;
        const actual=parseFloat(v)||0; const sys=Number(prods[i].qty)||0; const diff=actual-sys; const price=Number(prods[i].price)||0;
        results.push({productId:prods[i].id,name:prods[i].name,systemQty:sys,actualQty:actual,diff,diffValue:diff*price});
        if(diff<0) shortageVal+=Math.abs(diff)*price;
      });
      if(!results.length){toast("أدخل كمية واحدة على الأقل","err");return false;}
      await cRef().collection("stockCounts").add({results,shortageValue:shortageVal,byName:state.profile.name||state.user.email,byUid:state.user.uid,date:todayStr(),at:now()});
      logAction("stock_count",results.length+" منتج");
      toast("تم حفظ الجرد","ok"); return true;
    });
}

    });

// جلب التصنيفات المحفوظة للشركة
async function loadCategories(){
  try{ const d=await cRef().collection("meta").doc("categories").get(); return (d.exists&&d.data().list)||[]; }catch(e){ return []; }
}
async function saveCategories(list){
  await cRef().collection("meta").doc("categories").set({list});
}

// نافذة إدارة التصنيفات
async function categoriesModal(){
  const cats=await loadCategories();
  openModal("إدارة التصنيفات",
    "<div style='display:flex;gap:8px;margin-bottom:12px'><input id='newCat' class='input' placeholder='اسم تصنيف جديد'><button type='button' class='btn' id='addCatBtn'>إضافة</button></div>"+
    "<div id='catList'></div>",
    null, ()=>true, true);
  const render=(list)=>{ const w=$("catList"); if(!w) return; w.innerHTML=list.length?"":"<p class='muted'>لا توجد تصنيفات بعد</p>";
    list.forEach((cat,i)=>{ const row=el("div","review-row"); row.innerHTML="<span>"+esc(cat)+"</span>";
      const del=el("button","btn sm danger","حذف"); del.onclick=async()=>{ const nl=list.filter((_,j)=>j!==i); await saveCategories(nl); render(nl); }; row.appendChild(del); w.appendChild(row); });
  };

  },30);

// رابط واتساب من رقم سعودي/دولي
function waLink(phone){ let p=(phone||"").replace(/[^0-9]/g,""); if(p.startsWith("00"))p=p.slice(2); if(p.startsWith("0"))p="966"+p.slice(1); if(p.length===9)p="966"+p; return "https://wa.me/"+p; }
function normUrl(u){ u=(u||"").trim(); if(u&&!/^https?:\/\//i.test(u))u="https://"+u; return u; }

async function renderSupplierDetail(c,id){
  const doc=await cRef().collection("suppliers").doc(id).get();
  if(!doc.exists){ toast("المورد غير موجود","err"); return openPage("suppliers"); }
  const x=doc.data();
  c.innerHTML="";
  const back=el("button","btn sm","← رجوع للموردين"); back.style.marginBottom="14px"; back.onclick=()=>openPage("suppliers"); c.appendChild(back);
  // بطاقة بيانات المورد
  const head=el("div","card"); head.style.marginBottom="16px";
  let contact="";
  if(x.phone) contact+="<a class='btn sm' style='background:#25D366;color:#fff;border:none' href='"+waLink(x.phone)+"' target='_blank'>واتساب</a> <a class='btn sm' href='tel:"+esc(x.phone)+"'>اتصال</a> ";
  if(x.url) contact+="<a class='btn sm' href='"+esc(normUrl(x.url))+"' target='_blank'>🔗 الموقع</a>";
  head.innerHTML="<div style='display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap'>"+
    "<div><h2 style='font-size:22px'>"+esc(x.company)+"</h2>"+
    "<div class='muted' style='margin-top:4px'>المندوب: "+esc(x.rep||"—")+(x.phone?" · "+esc(x.phone):"")+"</div></div>"+
    "<div style='display:flex;gap:6px;flex-wrap:wrap'>"+contact+"</div></div>";
  const actions=el("div"); actions.style.marginTop="12px";
  if(can("suppliers","edit")){ const e=el("button","btn sm","تعديل بيانات المورد"); e.onclick=()=>supplierModal(id,x); actions.appendChild(e); }
  if(can("suppliers","delete")){ const dl=el("button","btn sm danger","حذف المورد"); dl.style.marginRight="6px"; dl.onclick=()=>{if(confirm("حذف المورد؟")){cRef().collection("suppliers").doc(id).delete();logAction("delete_supplier",x.company);openPage("suppliers");}}; actions.appendChild(dl); }
  head.appendChild(actions);
  c.appendChild(head);

  // منتجات المورد
  const pbar=el("div"); pbar.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px";
  pbar.innerHTML="<h3>المنتجات والأسعار</h3>";
  if(can("suppliers","edit")){ const add=el("button","btn primary sm","+ منتج"); add.onclick=()=>productPriceModal(id,x,null); pbar.appendChild(add); }
  c.appendChild(pbar);

  const list=el("div","card");
  const prods=x.products||[];
  if(!prods.length){ list.innerHTML="<p class='muted'>لا توجد منتجات. أضف منتجاً لتتبّع سعره.</p>"; }
  else{
    let html="<table><thead><tr><th>المنتج</th><th>السعر الحالي</th><th>أعلى</th><th>أقل</th><th>التغيّر</th><th>إجراء</th></tr></thead><tbody>";
    prods.forEach((p,i)=>{
      const hist=p.history||[]; const prices=hist.map(h=>Number(h.price));
      const high=prices.length?Math.max(...prices):Number(p.price)||0;
      const low=prices.length?Math.min(...prices):Number(p.price)||0;
      let change="—",col="var(--muted)";
      if(hist.length>=2){ const cur=Number(hist[hist.length-1].price), prev=Number(hist[hist.length-2].price);
        if(prev>0){ const pct=((cur-prev)/prev)*100; const up=pct>=0; change=(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"%"; col=up?"var(--red)":"var(--green)"; } }
      html+="<tr><td><b>"+esc(p.name)+"</b></td><td>"+money(p.price)+"</td><td class='muted'>"+money(high)+"</td><td class='muted'>"+money(low)+"</td>"+
        "<td style='color:"+col+"'>"+change+"</td><td><button class='btn sm' data-up='"+i+"'>تحديث السعر</button></td></tr>";
    });
    html+="</tbody></table>"; list.innerHTML=html;
  }
  c.appendChild(list);
  list.querySelectorAll("[data-up]").forEach(b=>{ b.onclick=()=>productPriceModal(id,x,parseInt(b.dataset.up)); });
}

// إضافة منتج جديد أو تحديث سعر منتج قائم (يُسجّل في السجل تلقائياً)
function productPriceModal(supId,supData,index){
  const isNew = index===null || index===undefined;
  const prod = isNew?null:(supData.products||[])[index];
  openModal(isNew?"إضافة منتج":"تحديث سعر: "+esc(prod?prod.name:""),
    (isNew?"<label class='field'><span>اسم المنتج *</span><input id='ppName' class='input'></label>":"")+
    "<label class='field'><span>"+(isNew?"السعر الحالي *":"السعر الجديد *")+"</span><input id='ppPrice' class='input' type='number' inputmode='decimal'></label>"+
    (isNew?"":"<p class='muted' style='font-size:13px'>يُضاف السعر للسجل ويُعاد حساب أعلى/أقل ونسبة التغيّر تلقائياً.</p>"),
    "حفظ", async ()=>{
      const price=parseFloat($("ppPrice").value);
      if(isNaN(price)||price<=0){toast("أدخل سعراً صحيحاً","err");return false;}
      const today=new Date().toISOString().slice(0,10);
      const ref=cRef().collection("suppliers").doc(supId);
      const fresh=(await ref.get()).data(); const products=fresh.products||[];
      if(isNew){
        const name=$("ppName").value.trim(); if(!name){toast("أدخل اسم المنتج","err");return false;}
        products.push({name,price,history:[{price,date:today}]});
        logAction("add_supplier_product",supData.company+" / "+name);
      }else{
        const p=products[index]; p.price=price; p.history=(p.history||[]); p.history.push({price,date:today});
        logAction("update_price",supData.company+" / "+p.name+" = "+price);
      }
      await ref.update({products});
      const c=$("pageContent"); renderSupplierDetail(c,supId);
      return true;
    });
}

async function branchEvalModal(id,x){
  const crit=await loadBranchCriteria();
  if(!crit.length){toast("أضف معايير التقييم أولاً (إدارة المعايير)","err");return;}
  const body=crit.map((cr,i)=>
    "<div class='card' style='margin-bottom:10px;padding:12px'>"+
      "<div style='font-weight:600;margin-bottom:8px'>"+(i+1)+". "+esc(cr)+"</div>"+
      "<div style='display:flex;gap:8px;margin-bottom:8px'>"+
        "<button type='button' class='btn sm yesbtn' data-i='"+i+"' data-v='1'>✓ إيه</button>"+
        "<button type='button' class='btn sm nobtn' data-i='"+i+"' data-v='0'>✗ لا</button></div>"+
      "<input class='input bnote' data-i='"+i+"' placeholder='ملاحظة (اختياري)' style='margin-bottom:8px'>"+
      "<input class='input bphoto' data-i='"+i+"' type='file' accept='image/*' capture='environment'>"+
    "</div>").join("");
  openModal("تقييم "+esc(x.name),body,"حفظ التقييم",()=>submitBranchEval(id,x,crit));
  window.__brEval={};
  setTimeout(()=>{document.querySelectorAll("#modalRoot .yesbtn,#modalRoot .nobtn").forEach(b=>{
    b.onclick=()=>{const i=b.dataset.i;window.__brEval[i]=b.dataset.v==="1";
      document.querySelectorAll("#modalRoot [data-i='"+i+"'].yesbtn,#modalRoot [data-i='"+i+"'].nobtn").forEach(o=>o.style.opacity="0.4");b.style.opacity="1";};});},30);
}
async function submitBranchEval(id,x,crit){
  const vals=window.__brEval||{};
  for(let i=0;i<crit.length;i++){if(vals[i]===undefined){toast("حدّد إيه/لا لكل المعايير","err");return false;}}
  const notes={},files={};
  document.querySelectorAll("#modalRoot .bnote").forEach(n=>notes[n.dataset.i]=n.value.trim());
  document.querySelectorAll("#modalRoot .bphoto").forEach(p=>{if(p.files[0])files[p.dataset.i]=p.files[0];});
  try{
    const ref=cRef().collection("branchEvals").doc();
    const results=[];
    for(let i=0;i<crit.length;i++){let photoUrl="";
      if(files[i]){try{const path="companies/"+state.companyId+"/branchEval/"+ref.id+"_"+i+".jpg";const snap=await storage.ref(path).put(files[i]);photoUrl=await snap.ref.getDownloadURL();}catch(e){photoUrl="";}}
      results.push({name:crit[i],ok:!!vals[i],note:notes[i]||"",photoUrl});
    }
    const yes=results.filter(r=>r.ok).length; const pct=Math.round(yes/results.length*100);
    await ref.set({branchId:id,branchName:x.name,date:todayStr(),byName:state.profile.name||state.user.email,results,pct,at:now()});
    logAction("add_branch_eval",x.name+" "+pct+"%");
    toast("تم حفظ التقييم","ok"); return true;
  }catch(e){console.error(e);toast("تعذّر الحفظ","err");return false;}
}
function viewBranchEval(r){
  const rows=(r.results||[]).map(t=>"<div class='review-row'><span>"+(t.ok?"✅":"❌")+" "+esc(t.name)+(t.note?" — <span class='muted'>"+esc(t.note)+"</span>":"")+"</span>"+(t.photoUrl?"<a class='btn sm' href='"+t.photoUrl+"' target='_blank'>صورة</a>":"")+"</div>").join("");
  openModal("تقييم "+esc(r.branchName)+" — "+esc(r.date),
    "<div class='review-row'><span>النتيجة</span><b>"+(r.pct||0)+"%</b></div><div style='margin-top:10px'>"+rows+"</div>","تم",()=>true,true);
}

function workDuration(start){
  if(!start) return "—"; const s=new Date(start), n=new Date(); if(isNaN(s)) return "—";
  let months=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());
  if(n.getDate()<s.getDate()) months--; if(months<0) return "—";
  const y=Math.floor(months/12), m=months%12;
  return (y?y+" سنة ":"")+(m?m+" شهر":(y?"":"أقل من شهر"));
}

async function loadPayroll(month){
  const wrap=$("payWrap"); if(!wrap) return; wrap.innerHTML="<div class='card muted'>جارٍ التحميل…</div>";
  const [empSnap,paySnap]=await Promise.all([cRef().collection("employees").orderBy("name").get(),cRef().collection("payroll").doc(month).get()]);
  const saved=(paySnap.exists&&paySnap.data().rows)||[];
  const byId={}; saved.forEach(r=>byId[r.empId]=r);
  const rows=[]; empSnap.forEach(d=>{const x=d.data(); const s=byId[d.id]||{};
    rows.push({empId:d.id,uid:x.uid||null,name:x.name,salary:Number(x.salary)||0,
      overtime:s.overtime||0,bonus:s.bonus||0,deductions:s.deductions||0,advance:s.advance||0});
  });
  const card=el("div","card");
  card.innerHTML="<table><thead><tr><th>الموظف</th><th>الأساسي</th><th>أوفر تايم</th><th>مكافآت</th><th>خصومات</th><th>سلفة</th><th>الصافي</th></tr></thead><tbody id='payRows'></tbody></table>"+
    (can("staff","edit")?"<div style='margin-top:14px'><button class='btn primary' id='savePay'>حفظ كشف "+month+"</button></div>":"");
  wrap.innerHTML=""; wrap.appendChild(card);
  const tb=$("payRows");
  const calc=()=>{ let total=0; rows.forEach((r,i)=>{ const net=r.salary+num("ot"+i)+num("bn"+i)-num("dd"+i)-num("ad"+i);
      const cell=$("net"+i); if(cell)cell.textContent=money(net); total+=net; });
    if($("payTotal"))$("payTotal").textContent=money(total); };
  const num=idp=>{const el=$(idp);return el?(parseFloat(el.value)||0):0;};
  const ed=can("staff","edit");
  rows.forEach((r,i)=>{
    const inp=(idp,val)=>ed?"<input id='"+idp+i+"' class='input' type='number' style='width:80px;padding:6px' value='"+(val||0)+"'>":money(val);
    const tr=el("tr",null,"<td><b>"+esc(r.name)+"</b></td><td>"+money(r.salary)+"</td><td>"+inp("ot",r.overtime)+"</td><td>"+inp("bn",r.bonus)+"</td><td>"+inp("dd",r.deductions)+"</td><td>"+inp("ad",r.advance)+"</td><td><b id='net"+i+"'>—</b></td>");
    tb.appendChild(tr);
  });
  if(ed) ["ot","bn","dd","ad"].forEach(p=>rows.forEach((_,i)=>{const el=$(p+i);if(el)el.oninput=calc;}));
  calc();
  if($("savePay"))$("savePay").onclick=async()=>{
    const out=rows.map((r,i)=>({empId:r.empId,uid:r.uid||null,name:r.name,salary:r.salary,overtime:num("ot"+i),bonus:num("bn"+i),deductions:num("dd"+i),advance:num("ad"+i),
      net:r.salary+num("ot"+i)+num("bn"+i)-num("dd"+i)-num("ad"+i)}));
    const total=out.reduce((a,b)=>a+b.net,0);
    await cRef().collection("payroll").doc(month).set({month,rows:out,total,updatedAt:now()});
    // نسخة راتب خاصة لكل موظف له حساب (يقرأها هو فقط)
    for(const r of out){ if(r.uid){ try{ await cRef().collection("mySalary").doc(r.uid).set({
      month,salary:r.salary,overtime:r.overtime,bonus:r.bonus,deductions:r.deductions,advance:r.advance,net:r.net,updatedAt:now()}); }catch(e){} } }
    logAction("save_payroll",month); toast("تم حفظ كشف "+month,"ok");
  };
}

async function evaluationModal(){
  let emps=[];try{const s=await cRef().collection("employees").orderBy("name").get();s.forEach(d=>emps.push({id:d.id,...d.data()}));}catch(e){}
  if(!emps.length){toast("أضف موظفين أولاً","err");return;}
  const opts=emps.map(e=>"<option value='"+e.id+"'>"+esc(e.name)+"</option>").join("");
  const crit=EVAL_CRITERIA.map((cr,i)=>
    "<div class='review-row'><span>"+esc(cr)+"</span><span id='star"+i+"'></span></div>").join("");
  openModal("تقييم موظف",
    "<label class='field'><span>الموظف *</span><select id='evEmp'>"+opts+"</select></label>"+
    "<div class='muted' style='font-size:13px;margin-bottom:8px'>اختر التقييم لكل معيار (0–5):</div>"+crit,
    "حفظ التقييم", async ()=>{
      const scores=EVAL_CRITERIA.map((_,i)=>window.__ev&&window.__ev[i]||0);
      const sum=scores.reduce((a,b)=>a+b,0); const max=EVAL_CRITERIA.length*5;
      const pct=Math.round(sum/max*100);
      const sel=$("evEmp"); const emp=emps.find(e=>e.id===sel.value);
      await cRef().collection("evaluations").add({empId:sel.value,name:emp?emp.name:"",date:new Date().toISOString().slice(0,10),
        scores,sum,pct,evaluatorName:state.profile.name||state.user.email,at:now()});
      logAction("add_evaluation",(emp?emp.name:"")+" "+pct+"%");
      toast("تم حفظ التقييم","ok"); return true;
    });
  window.__ev={};
  setTimeout(()=>{ EVAL_CRITERIA.forEach((_,i)=>{ renderStars(i); }); },30);
}
function renderStars(i){
  const wrap=$("star"+i); if(!wrap) return; wrap.innerHTML="";
  for(let s=1;s<=5;s++){ const b=el("span",null,"☆"); b.style.cssText="cursor:pointer;font-size:22px;color:var(--brand)";
    b.onclick=()=>{ window.__ev[i]=s; for(let j=1;j<=5;j++){ wrap.children[j-1].textContent=j<=s?"★":"☆"; } };
    wrap.appendChild(b);
  }
}

function runChecklistModal(id,x){
  const tasks=x.tasks||[];

  const body=tasks.map((t,i)=>

      "<input class='input note' data-i='"+i+"' placeholder='ملاحظة (اختياري)' style='margin-bottom:8px'>"+
      "<input class='input photo' data-i='"+i+"' type='file' accept='image/*' capture='environment'>"+
    "</div>").join("");
  openModal("تنفيذ: "+esc(x.name),

    "حفظ التنفيذ", ()=>submitRun(id,x,tasks));
  window.__runVals={};
  setTimeout(()=>{ document.querySelectorAll("#modalRoot .okbtn,#modalRoot .nobtn").forEach(b=>{
    b.onclick=()=>{ const i=b.dataset.i; window.__runVals[i]=b.dataset.v==="1";
      document.querySelectorAll("#modalRoot [data-i='"+i+"'].okbtn,#modalRoot [data-i='"+i+"'].nobtn").forEach(x2=>x2.style.opacity="0.4");
      b.style.opacity="1"; }; }); },30);
}
async function submitRun(id,x,tasks){
  const vals=window.__runVals||{};
  for(let i=0;i<tasks.length;i++){ if(vals[i]===undefined){toast("حدّد صح/خطأ لكل المهام","err");return false;} }
  const notes={}, files={};
  document.querySelectorAll("#modalRoot .note").forEach(n=>notes[n.dataset.i]=n.value.trim());
  document.querySelectorAll("#modalRoot .photo").forEach(p=>{ if(p.files[0]) files[p.dataset.i]=p.files[0]; });
  try{
    const ref=cRef().collection("checklistRuns").doc();
    const results=[];
    for(let i=0;i<tasks.length;i++){
      let photoUrl="";
      if(files[i]){ try{ const path="companies/"+state.companyId+"/checklist/"+ref.id+"_"+i+".jpg";
        const snap=await storage.ref(path).put(files[i]); photoUrl=await snap.ref.getDownloadURL(); }catch(e){ photoUrl=""; } }
      results.push({taskId:tasks[i].id,text:tasks[i].text,ok:!!vals[i],note:notes[i]||"",photoUrl});
    }
    const okCount=results.filter(r=>r.ok).length; const pct=Math.round(okCount/results.length*100);
    await ref.set({checklistId:id,checklistName:x.name,date:todayStr(),byUid:state.user.uid,byName:state.profile.name||state.user.email,
      results,pct,status:"submitted",at:now()});
    logAction("submit_checklist",x.name+" "+pct+"%");
    toast("تم حفظ التنفيذ","ok"); return true;
  }catch(e){console.error(e);toast("تعذّر الحفظ","err");return false;}
}

function openModal(title,bodyHtml,okLabel,onOk,hideCancel,maxWidth){

function currentRoleLetter(){ return state.role==="owner"||state.role==="super"?"o":state.role==="manager"?"m":"e"; }
function normalizeAr(s){ return (s||"").replace(/[أإآ]/g,"ا").replace(/[ةه]/g,"ه").replace(/[ىي]/g,"ي").replace(/[ًٌٍَُِّْ]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function openHelp(){
  const rl=currentRoleLetter();
  const list=FAQ.filter(f=>f.roles.includes(rl));
  const isEn=LANG==="en";
  const render=(items)=>items.map((f,i)=>{
    const q=isEn&&f.qen?f.qen:f.q, a=isEn&&f.aen?f.aen:f.a;
    return "<details style='margin-bottom:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px'><summary style='cursor:pointer;font-weight:600'>"+esc(q)+"</summary><p class='muted' style='margin-top:8px;line-height:1.8'>"+esc(a)+"</p></details>";
  }).join("");
  openModal(isEn?"Support":"الدعم الفني",
    "<input id='helpSearch' class='input' placeholder='"+(isEn?"Search your question…":"ابحث عن سؤالك…")+"' style='margin-bottom:12px'>"+
    "<div id='helpResults'>"+render(list)+"</div>"+
    "<p class='muted' style='font-size:12px;margin-top:12px'>"+(isEn?"Can't find an answer? Contact your company owner.":"ما لقيت جواب؟ تواصل مع صاحب الشركة.")+"</p>",
    null,()=>true,true,560);
  setTimeout(()=>{
    const inp=$("helpSearch"); if(!inp) return;
    inp.oninput=()=>{
      const term=normalizeAr(inp.value); const termEn=(inp.value||"").toLowerCase().trim();
      if(!term){ $("helpResults").innerHTML=render(list); translateTree($("helpResults")); return; }
      const found=list.filter(f=>{
        const hay=normalizeAr(f.q+" "+f.a)+" "+((f.qen||"")+" "+(f.aen||"")).toLowerCase();
        return term.split(" ").some(w=>w&&hay.includes(w)) || (termEn&&hay.includes(termEn));
      });
      $("helpResults").innerHTML=found.length?render(found):"<p class='muted'>"+(isEn?"No matching answer. Contact your company owner.":"ما فيه جواب مطابق. تواصل مع صاحب الشركة.")+"</p>";
    };
  },30);
}
window.openHelp=openHelp;

}
window.openProfile=openProfile;
// تهيئة اللغة عند التحميل
// الوضع فاتح/غامق (تفضيل شخصي محفوظ في المتصفح)
function currentMode(){ try{ return localStorage.getItem("cafe_mode")||"light"; }catch(e){ return "light"; } }
function applyMode(m){
  document.documentElement.setAttribute("data-mode", m==="dark"?"dark":"light");
  const b=document.getElementById("modeBtn"); if(b) b.textContent = m==="dark"?"☀️":"🌙";
}
function toggleMode(){ const m=currentMode()==="dark"?"light":"dark"; try{localStorage.setItem("cafe_mode",m);}catch(e){} applyMode(m); }window.toggleMode=toggleMode;

// شكل الأيقونات: ملوّنة / بدون لون (شخصي)
function currentIcons(){ try{ return localStorage.getItem("cafe_icons")||"color"; }catch(e){ return "color"; } }
function applyIcons(v){ document.documentElement.setAttribute("data-icons", v==="mono"?"mono":"color"); }
function setIcons(v){ try{localStorage.setItem("cafe_icons",v);}catch(e){} applyIcons(v); }
window.setIcons=setIcons;

(function initLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANGS.find(x=>x.k===LANG)||{}).dir||"rtl";
  applyLoginLang(); renderLangSwitchers();
})();
applyMode(currentMode());
applyIcons(currentIcons());
</script>
</body>
