<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكوّن قائمة الإجراءات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #f4f6fb;
    padding: 24px;
    color: #1f2937;
  }
  h2 { margin-bottom: 16px; font-size: 18px; }
  .note { color:#6b7280; font-size:13px; margin-bottom:20px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.05);
  }
  th, td { padding: 16px 12px; text-align: center; font-size: 14px; }
  th { color:#6b7280; font-weight:600; }
  tr + tr td { border-top: 1px solid #f0f0f3; }

  .status-ok {
    background:#e7f6ec; color:#1a8f4c;
    padding:8px 14px; border-radius:999px;
    font-weight:600; font-size:13px; display:inline-block;
  }

  /* ===== مكوّن قائمة الإجراءات (انسخ من هنا) ===== */
  .actions-menu { position: relative; display: inline-block; }
  .actions-btn {
    display:inline-flex; align-items:center; gap:6px;
    background:#f3f4f6; color:#374151;
    border:1px solid #e5e7eb; border-radius:10px;
    padding:9px 16px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit; white-space:nowrap;
    transition:background .15s;
  }
  .actions-btn:hover { background:#e9ebef; }
  .actions-btn .caret { font-size:10px; opacity:.6; }

  .actions-list {
    position:absolute; top:calc(100% + 6px); left:0;
    min-width:150px; background:#fff;
    border:1px solid #eceef2; border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    padding:6px; z-index:50;
    display:none;
  }
  .actions-menu.open .actions-list { display:block; }
  .actions-list button {
    display:flex; align-items:center; gap:8px;
    width:100%; text-align:right;
    background:none; border:none; border-radius:8px;
    padding:10px 12px; font-size:14px; font-weight:500;
    cursor:pointer; color:#374151; font-family:inherit;
    transition:background .12s;
  }
  .actions-list button:hover { background:#f5f6f8; }
  .actions-list button.danger { color:#dc2626; }
  .actions-list button.danger:hover { background:#fdecec; }
  .actions-list .dot { width:7px; height:7px; border-radius:50%; background:#9ca3af; }
  .actions-list button.danger .dot { background:#dc2626; }
  .actions-list button.primary .dot { background:#16a34a; }
  /* ===== نهاية المكوّن ===== */
</style>
</head>
<body>

<h2>الإقفال اليومي</h2>
<p class="note">اضغط على "إجراءات" لاختيار العملية — مكوّن واحد تقدر تستخدمه بأي جدول</p>

<table>
  <thead>
    <tr>
      <th>إجراء</th>
      <th>الحالة</th>
      <th>المُرسِل</th>
      <th>الفرع</th>
      <th>التاريخ والوقت</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
/* ============================================================
   مكوّن قائمة الإجراءات القابل لإعادة الاستخدام
   الاستخدام: buildActionsMenu(id, [{label, type, onClick}, ...])
   type: 'default' | 'primary' | 'danger'
   ============================================================ */
function buildActionsMenu(rowId, actions) {
  const wrap = document.createElement('div');
  wrap.className = 'actions-menu';

  const btn = document.createElement('button');
  btn.className = 'actions-btn';
  btn.innerHTML = 'إجراءات <span class="caret">▾</span>';

  const list = document.createElement('div');
  list.className = 'actions-list';

  actions.forEach(a => {
    const item = document.createElement('button');
    item.className = a.type || 'default';
    item.innerHTML = '<span class="dot"></span>' + a.label;
    item.onclick = (e) => {
      e.stopPropagation();
      wrap.classList.remove('open');
      a.onClick(rowId);
    };
    list.appendChild(item);
  });

  btn.onclick = (e) => {
    e.stopPropagation();
    // اقفل أي قائمة ثانية مفتوحة
    document.querySelectorAll('.actions-menu.open').forEach(m => {
      if (m !== wrap) m.classList.remove('open');
    });
    wrap.classList.toggle('open');
  };

  wrap.appendChild(btn);
  wrap.appendChild(list);
  return wrap;
}

// اقفل القوائم عند الضغط في أي مكان بالصفحة
document.addEventListener('click', () => {
  document.querySelectorAll('.actions-menu.open').forEach(m => m.classList.remove('open'));
});

/* ============================================================
   مثال: بناء صفوف الجدول
   ============================================================ */
const data = [
  { id: 'C-1001', branch: 'فرع التنميه', sender: 'تجارب', date: '2026/8/11 01:51 ص', status: 'تم الاعتماد' },
  { id: 'C-1002', branch: 'فرع التنميه', sender: 'تجارب', date: '2026/8/11 01:51 ص', status: 'تم الاعتماد' },
];

const tbody = document.getElementById('rows');
data.forEach(row => {
  const tr = document.createElement('tr');

  // خلية الإجراء
  const tdAction = document.createElement('td');
  const menu = buildActionsMenu(row.id, [
    { label: 'عرض',  type: 'default', onClick: (id) => alert('عرض: ' + id) },
    { label: 'رفض',  type: 'danger',  onClick: (id) => alert('رفض: ' + id) },
    // تقدر تزيد أي إجراء هنا (اعتماد، تعديل، حذف...) ويطبق بكل الجداول
  ]);
  tdAction.appendChild(menu);

  tr.appendChild(tdAction);
  tr.insertAdjacentHTML('beforeend', `
    <td><span class="status-ok">${row.status}</span></td>
    <td>${row.sender}</td>
    <td>${row.branch}</td>
    <td>${row.date}</td>
  `);
  tbody.appendChild(tr);
});
</script>
</body>
</html>
