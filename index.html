<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>رُواق</title>

<!-- ============================================================= -->
<!-- Firebase (compat) — الوحيدة اللي تحتاج إنترنت وقت التشغيل      -->
<!-- ============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
/* ============================ نظام التصميم ============================ */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f7; --line:#e4e8f0;
  --text:#1e2532; --muted:#6b7280; --brand:#6366f1; --brand-2:#818cf8;
  --green:#16a34a; --red:#e5484d; --amber:#e08a0b; --blue:#3b82f6;
  --radius:16px; --shadow:0 6px 22px rgba(30,41,59,.08);
  font-family:"Segoe UI",system-ui,-apple-system,"Tahoma",sans-serif;
}
html[data-mode="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2a2f3a;
  --text:#e8eaed; --muted:#9aa3b2;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
/* أيقونات بدون لون (رمادي) */
html[data-icons="mono"] .nav-item .ic,
html[data-icons="mono"] .card > div[style*="font-size:30px"],
html[data-icons="mono"] .card > div[style*="font-size:26px"],
html[data-icons="mono"] .kpi .l{ filter:grayscale(1) opacity(.7); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:15px}
body{-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--brand-2);text-decoration:none}
button{font-family:inherit}
.hidden{display:none !important}
.muted{color:var(--muted)}
.center{display:flex;align-items:center;justify-content:center}

/* عناصر عامة */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:10px;
  padding:10px 16px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--text);
  border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:15px;outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label.field{display:block;margin-bottom:14px}
label.field > span{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.green{background:rgba(63,185,132,.15);color:var(--green)}
.tag.red{background:rgba(229,100,95,.15);color:var(--red)}
.tag.amber{background:rgba(224,165,75,.15);color:var(--amber)}

table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.3px}
tbody tr:hover{background:var(--surface-2)}

/* شاشة الدخول */
#loginScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 520px at 50% -10%, rgba(200,161,90,.22), transparent 60%),
    radial-gradient(760px 520px at 108% 112%, rgba(200,161,90,.12), transparent 62%),
    var(--bg)}
.login-box{width:100%;max-width:404px;position:relative;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:34px 30px 24px;
  box-shadow:0 24px 60px rgba(30,41,59,.14),0 2px 8px rgba(30,41,59,.05)}
.login-box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.login-langs{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
/* علامة القوس — من معنى «رُواق» (الرواق المعمَّد) */
.arch-mark{width:76px;height:84px;margin:0 auto 18px;position:relative;
  border-radius:50% 50% 16px 16px / 62% 62% 16px 16px;
  background:linear-gradient(160deg,var(--brand-2),var(--brand));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 28px rgba(200,161,90,.40),inset 0 2px 3px rgba(255,255,255,.4)}
.arch-mark b{font-size:30px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.arch-mark::after{content:"";position:absolute;top:7px;left:9px;right:9px;height:30px;
  border-radius:50% 50% 10px 10px / 72% 72% 10px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.32),transparent)}
.login-title{text-align:center;font-size:23px;font-weight:800;letter-spacing:-.2px;margin:0;color:var(--text)}
.login-sub{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 24px}
.login-box .field{margin-bottom:15px}
.login-box .input{padding:13px 14px;border-radius:12px;font-size:15px}
.login-box .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,161,90,.20);outline:none}
.login-btn{width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:700;margin-top:4px;
  box-shadow:0 10px 22px rgba(200,161,90,.34)}
.login-btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.login-err{color:var(--red);text-align:center;margin-top:14px;font-size:13px}
.login-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;
  padding-top:15px;border-top:1px solid var(--line)}
.brand-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}

/* التخطيط الرئيسي */
.layout{display:flex;min-height:100%}
.sidebar{width:250px;background:var(--surface);border-left:1px solid var(--line);
  padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--surface-2);color:var(--brand-2)}
.nav-item .ic{width:20px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);gap:12px}
.content{padding:24px;max-width:1200px;width:100%}
.page-title{margin-bottom:20px}
.page-title h2{font-size:22px}
.page-title p{color:var(--muted);margin:4px 0 0;font-size:14px}

/* بطاقات المؤشرات */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .v{font-size:26px;font-weight:800;margin-top:6px}
.kpi .l{color:var(--muted);font-size:13px}

/* المصفوفة (الصلاحيات) */
.matrix{overflow:auto}
.matrix th,.matrix td{text-align:center;padding:8px}
.matrix td:first-child,.matrix th:first-child{text-align:right}

/* المودال */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .body{padding:20px}
.modal .foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}

/* التوست */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);min-width:240px}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}

.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.review-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.sec{background:var(--surface-2,#eef1f7);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:13px}
.sec-title{font-weight:800;margin-bottom:9px;font-size:14.5px}
.review-row b{color:var(--brand-2)}
.photo-prev{margin-top:8px;border-radius:10px;max-height:180px;border:1px solid var(--line)}

@media(max-width:820px){
  .sidebar{position:fixed;right:-260px;z-index:40;transition:.2s} .sidebar.open{right:0}
  .content{padding:16px}
}
.hamb{display:none} @media(max-width:820px){.hamb{display:inline-flex}}

/* ===== شاشة المخزون (Hub) — تصميم وتفاعلات ===== */
.inv-hub .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.inv-add-sq{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  border:none;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 18px rgba(200,161,90,.34);line-height:1;flex-shrink:0;transition:transform .15s,filter .15s}
.inv-add-sq:hover{filter:brightness(1.05)}
.inv-add-sq:active{transform:scale(.9)}
.inv-hub .wh-card{cursor:pointer;border:1px solid var(--brand-2);min-height:120px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;margin-bottom:14px}
.inv-hub .wh-card .t{font-weight:800;font-size:18px}
.inv-hub .wh-card .d{color:var(--muted);font-size:13px;margin-top:2px}
.inv-hub .tr-wrap{display:flex;justify-content:center;margin-bottom:18px}
.inv-hub .tr-card{cursor:pointer;min-height:110px;width:62%;text-align:center;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
@media(max-width:520px){.inv-hub .tr-card{width:100%}}
.inv-hub .tr-card .t{font-weight:800}
.inv-hub .tr-card .d{color:var(--muted);font-size:12px}
.inv-hub .section-label{font-weight:700;font-size:14px;color:var(--muted);margin:0 0 10px}
.inv-hub .branches-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inv-hub .br-card{cursor:pointer;padding:14px 8px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.inv-hub .br-card .t{font-weight:700;font-size:13px}
.inv-hub .br-card .st{font-size:15px;color:var(--brand)}
/* تفاعل اللمس للبطاقات */
.tapc{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
.tapc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(30,41,59,.14);border-color:var(--brand)}
.tapc:active{transform:scale(.97)}
/* حركة دخول متدرّجة */
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.animin{opacity:0;animation:cardIn .5s ease forwards}
/* انتقال ناعم عند فتح قسم */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.view-enter{animation:viewIn .32s ease}
/* زر الحالة الذكي (يعرض الحالة ويفتح الخيارات) */
.btn.status-act{border:none;font-weight:700}
.btn.status-act.green{background:rgba(22,163,74,.13);color:var(--green)}
.btn.status-act.amber{background:rgba(224,138,11,.15);color:var(--amber)}
.btn.status-act.red{background:rgba(229,72,77,.13);color:var(--red)}
.btn.status-act:hover{filter:brightness(.97)}
/* مراجعة الطلب: تمييز النقص + صندوق التحذير */
tr.ord-short td{background:rgba(229,72,77,.06)}
tr.ord-short td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.ord-warn{background:#fff4f4;border:1px solid #f3b4b4;color:#b42318;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.9;margin-top:14px;display:flex;flex-direction:column;gap:4px}
.ord-warn b{color:#b42318}
/* الزر المزدوج (تبويبات الفرع في المخزون) */
.seg2{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.seg2 button{flex:1;border:none;background:var(--surface);padding:15px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;color:var(--muted);transition:.18s}
.seg2 button:first-child{border-left:1px solid var(--line)}
.seg2 button.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.seg-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;padding:0 5px;margin-right:6px;vertical-align:middle}
.seg2 button.active .seg-badge{background:rgba(255,255,255,.35)}
</style>
</head>
<body>

<!-- ================= شاشة التحميل ================= -->
<div id="bootScreen" class="center" style="height:100%"><div class="spinner"></div></div>

<!-- ================= شاشة الدخول ================= -->
<div id="loginScreen" class="hidden">
  <div class="login-box">
    <div class="login-langs" id="loginLangs"></div>
    <div class="arch-mark" aria-hidden="true"><b>☕</b></div>
    <h1 id="lgTitle" class="login-title">حيّاك الله في رُواق</h1>
    <p id="lgSub" class="login-sub">من هنا تقدر تدير محلك</p>
    <label class="field"><span id="lgEmail">البريد الإلكتروني</span><input id="loginEmail" class="input" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label class="field"><span id="lgPass">كلمة المرور</span><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button id="loginBtn" class="btn primary login-btn">دخول</button>
    <p id="loginErr" class="login-err hidden"></p>
    <div class="login-foot" id="lgFoot">دخول آمن ومشفّر</div>
  </div>
</div>

<!-- ================= التطبيق الرئيسي ================= -->
<div id="appScreen" class="hidden">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><div class="brand-mark" style="width:36px;height:36px;font-size:18px;margin:0">☕</div>
        <div><div style="font-weight:800;font-size:15px" id="sideCompany">المنصة</div><div class="muted" style="font-size:11px" id="sideRole">—</div></div>
      </div>
      <nav id="navList"></nav>
      <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--line)">
        <div style="display:flex;gap:6px;padding:6px 12px" id="navLangs"></div>
        <div style="padding:8px 12px"><div style="font-weight:600;font-size:13px" id="sideUser">—</div><div class="muted" style="font-size:11px" id="sideEmail">—</div></div>
        <button class="btn ghost sm" id="logoutBtn" style="width:100%" onclick="doLogout()">تسجيل الخروج</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="btn ghost sm hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <button class="btn ghost sm" id="backBtn" title="رجوع" onclick="navBack()" style="display:none;font-size:15px;padding:5px 9px">←</button>
        <div style="flex:1"></div>
        <button class="btn ghost sm" id="homeBtn" title="الرئيسية" onclick="navHome()" style="display:none;font-size:13px;padding:5px 8px">🏠</button>
        <button class="btn ghost sm" id="profileBtn" title="ملف شخصي" onclick="openProfile()" style="font-size:14px;padding:5px 9px">👤</button>
      </div>
      <div class="content" id="pageContent"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<button id="helpFab" onclick="openHelp()" title="الدعم الفني" style="display:none"></button>
<div id="toast"></div>

<script>
/* ================================================================== */
/*  1) الإعدادات — عدّل هذي القيم فقط                                  */
/* ================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyDM_BuM3-DiMGOsEYs6GCbeVf2j5CmUZ_o",
  authDomain:        "cafe-platform.firebaseapp.com",
  projectId:         "cafe-platform",
  storageBucket:     "cafe-platform.firebasestorage.app",
  messagingSenderId: "65643654001",
  appId:             "1:65643654001:web:efe7e5dcb802095b9624d0"
};

// بريد/بُرُد مالك المنصة (Super Admin) — أول دخول لأي منهم يُنشئ حسابه تلقائياً
const SUPER_ADMIN_EMAILS = ["ben.soud.009@gmail.com"];
// باقات الاشتراك وحدود الفروع
const PLANS = {
  small:      {name:"صغيرة",   nameEn:"Small",      maxBranches:3},
  medium:     {name:"متوسطة",  nameEn:"Medium",     maxBranches:6},
  large:      {name:"كبيرة",   nameEn:"Large",      maxBranches:10},
  enterprise: {name:"الشركات", nameEn:"Enterprise", maxBranches:Infinity}
};
function planOf(cd){ return (cd&&cd.plan&&PLANS[cd.plan])?cd.plan:"enterprise"; } // الشركات الحالية بلا باقة = غير محدودة
function planMax(cd){ return PLANS[planOf(cd)].maxBranches; }
function planLabel(cd){ const p=PLANS[planOf(cd)]; return LANG==="en"?p.nameEn:p.name; }

/* ================================================================== */
/*  2) ثوابت النظام                                                    */
/* ================================================================== */
// الأقسام والعمليات (تُستخدم في مصفوفة الصلاحيات)
const MODULES = [
  {key:"dashboard",  name:"لوحة التحكم", icon:""},
  {key:"sales",      name:"الإقفال اليومي", icon:""},
  {key:"invoices",   name:"الفواتير", icon:""},
  {key:"inventory",  name:"المخزون", icon:""},
  {key:"expenses",   name:"المصروفات", icon:""},
  {key:"suppliers",  name:"الموردين", icon:""},
  {key:"staff",      name:"شؤون الموظفين", icon:""},
  {key:"checklist",  name:"قوائم التحقّق التشغيلي", icon:""},
  {key:"recipes",    name:"الوصفات", icon:""},
  {key:"reports",    name:"التقارير", icon:""},
  {key:"branches",   name:"الفروع", icon:""},
  {key:"settings",   name:"الإعدادات", icon:""}
];
const ACTIONS = [
  {key:"view",    name:"عرض"},
  {key:"add",     name:"إضافة"},
  {key:"edit",    name:"تعديل"},
  {key:"delete",  name:"حذف"},
  {key:"approve", name:"اعتماد"},
  {key:"export",  name:"تصدير"}
];

// أي مرحلة مبنية فعلياً في هذا الأساس (Phase 1)
const BUILT = new Set(["dashboard","sales","branches","employees","settings"]);

/* ================================================================== */
/*  اللغات (متعدد اللغات — يُترجَم تدريجياً)                            */
/* ================================================================== */
const LANGS=[{k:"ar",n:"ع",dir:"rtl"},{k:"en",n:"EN",dir:"ltr"}];
let LANG="ar";
try{ const sv=localStorage.getItem("cafe_lang"); if(sv) LANG=sv; }catch(e){}
const I18N={

function L(s){ if(LANG!=="en"||s==null) return s; const raw=""+s; const k=raw.trim(); if(!k||!EN[k]) return s; const lead=(raw.match(/^\s*/)||[""])[0], trail=(raw.match(/\s*$/)||[""])[0]; return lead+EN[k]+trail; }
// ترجمة عناصر الصفحة تلقائياً (النصوص المطابقة في القاموس)
function translateTree(root){
  if(LANG!=="en"||!root) return;
  try{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{ const raw=n.nodeValue; if(!raw) return; const key=raw.trim(); if(key && EN[key]) n.nodeValue=raw.replace(key,EN[key]); });
    root.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(inp=>{ const k=(inp.getAttribute("placeholder")||"").trim(); if(EN[k]) inp.setAttribute("placeholder",EN[k]); });
  }catch(e){}
}
function setLang(l){
  LANG=l; try{ localStorage.setItem("cafe_lang",l); }catch(e){}
  const dir=(LANGS.find(x=>x.k===l)||{}).dir||"rtl";
  document.documentElement.lang=l; document.documentElement.dir=dir;
  applyLoginLang(); renderLangSwitchers();
  if(state.user){ buildShell(); if(state.role==="super"){renderSuperNav();} else {renderCompanyNav();} if(state.current==="__home__"){ renderCardsHome(); } else if(state.current) openPage(state.current,true); }
}
function renderLangSwitchers(){
  ["loginLangs","navLangs"].forEach(id=>{ const w=document.getElementById(id); if(!w) return; w.innerHTML="";
    LANGS.forEach(l=>{ const b=document.createElement("button"); b.className="btn sm"+(LANG===l.k?" primary":""); b.textContent=l.n; b.style.padding="4px 10px"; b.onclick=()=>setLang(l.k); w.appendChild(b); });
  });
}

// ضغط الصورة وتحويلها Base64 (بدون Storage) — يُحفظ داخل قاعدة البيانات مباشرة
function compressToBase64(file, maxDim, quality){
  maxDim=maxDim||1200; quality=quality||0.6;
  return new Promise((resolve)=>{
    try{
      const reader=new FileReader();
      reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          let w=img.width,h=img.height;
          if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
          else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          let out=cv.toDataURL("image/jpeg",quality);
          // لو أكبر من ~850 كيلو، اضغط أكثر
          if(out.length>850000){ out=cv.toDataURL("image/jpeg",0.4); }
          if(out.length>950000){ const cv2=document.createElement("canvas"); const s=0.7; cv2.width=Math.round(w*s); cv2.height=Math.round(h*s); cv2.getContext("2d").drawImage(img,0,0,cv2.width,cv2.height); out=cv2.toDataURL("image/jpeg",0.5); }
          resolve(out);
        };
        img.onerror=()=>resolve("");
        img.src=e.target.result;
      };
      reader.onerror=()=>resolve("");
      reader.readAsDataURL(file);
    }catch(e){ resolve(""); }
  });
}
// رفع صورة مع مهلة زمنية: لو تعذّر (Storage غير مفعّل) أو تأخّر، يرجع "" بدل أن يتجمّد
async function tryUploadImage(path,file,ms){
  ms=ms||8000;
  try{
    return await Promise.race([
      (async()=>{ const snap=await storage.ref(path).put(file); return await snap.ref.getDownloadURL(); })(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("upload-timeout")),ms))
    ]);
  }catch(e){ console.warn("تعذّر رفع الصورة، سيُحفظ بدون صورة:",e&&e.message); return ""; }
}

// ===== أدوات الاشتراك =====
// يحوّل قيمة تاريخ (Timestamp أو نص أو Date) إلى كائن Date
function toDate(v){ if(!v) return null; if(v.toDate) return v.toDate(); const d=new Date(v); return isNaN(d)?null:d; }
// تاريخ انتهاء الاشتراك
function subEndDate(cdata){ const s=cdata&&cdata.subscription; if(!s) return null; return toDate(s.endsAt); }
// كم يوم باقٍ (سالب = منتهٍ)
function subDaysLeft(cdata){ const e=subEndDate(cdata); if(!e) return null; return Math.ceil((e-new Date())/(1000*60*60*24)); }
function subExpired(cdata){ const d=subDaysLeft(cdata); return d!==null && d<0; }

let MAINT = {};                 // { moduleKey: true }  عام لكل الشركات
let HIDDEN = {};                // { moduleKey: true }  أقسام مخفية عن الشركات
let _maintUnsub = null;
function moduleUnderMaintenance(key){ return MAINT && MAINT[key]===true; }
function moduleHidden(key){ return HIDDEN && HIDDEN[key]===true; }
// مالك المنصة الفعلي (ليس أثناء الدخول الإداري) يتخطّى الصيانة والإخفاء
function bypassMaintenance(){ return state.role==="super" || impersonation.active; }
function subscribeMaintenance(){
  if(_maintUnsub) return;
  try{
    _maintUnsub = db.collection("platform").doc("config").onSnapshot(snap=>{
      const cfg = snap.exists ? snap.data() : {};
      MAINT = (cfg && cfg.maintenance) ? cfg.maintenance : {};
      HIDDEN = (cfg && cfg.hidden) ? cfg.hidden : {};
      // الشركة: أعِد بناء القائمة (لإخفاء/إظهار الأقسام) وأعِد فتح القسم الحالي
      if(state.user && !bypassMaintenance()){
        if(state.role==="super"){ /* لن يحدث */ }
        else if(cardsMode()){ if(state.current==="__home__") renderCardsHome(); }
        else { renderCompanyNav(); }
        if(state.current && state.current!=="__home__"){ openPage(state.current, true); }
      }
      // لو مالك المنصة فاتح صفحة الصيانة → حدّثها
      if(state.current==="super_maint" && state.role==="super"){ const c=$("pageContent"); if(c) pageMaintenance(c); }
    }, ()=>{ MAINT={}; HIDDEN={}; });
  }catch(e){ MAINT={}; HIDDEN={}; }
}

function randomPassword(){
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ", b="abcdefghijkmnpqrstuvwxyz", n="23456789", s="!@#$%*";
  const all=a+b+n+s; let p=a[Math.floor(Math.random()*a.length)]+b[Math.floor(Math.random()*b.length)]+n[Math.floor(Math.random()*n.length)]+s[Math.floor(Math.random()*s.length)];
  for(let i=0;i<6;i++) p+=all[Math.floor(Math.random()*all.length)];
  return p.split("").sort(()=>Math.random()-0.5).join("");
}

    "<div id='repBody'><p class='muted'>اختر الفترة واضغط «عرض».</p></div>";
  $("repRun").onclick=()=>runReports($("repFrom").value,$("repTo").value);
  runReports($("repFrom").value,$("repTo").value);
}
async function runReports(from,to){
  const body=$("repBody"); if(!body) return;
  body.innerHTML="<p class='muted'>جارٍ التحميل…</p>";
  const toEnd=to; // inclusive by using <= via string compare on date field (YYYY-MM-DD)
  try{
    const [clo,inv,prods,waste,pay,evals,exps]=await Promise.all([
      cRef().collection("dailyClosings").where("date",">=",from).where("date","<=",toEnd).get(),
      cRef().collection("invoices").where("date",">=",from).where("date","<=",toEnd).get(),
      cRef().collection("products").get(),
      cRef().collection("waste").where("date",">=",from).where("date","<=",toEnd).get(),
      cRef().collection("payroll").get(),
      cRef().collection("branchEvals").where("date",">=",from).where("date","<=",toEnd).get().catch(()=>({forEach:()=>{}})),
      cRef().collection("expenses").where("date",">=",from).where("date","<=",toEnd).get().catch(()=>({forEach:()=>{}}))
    ]);
    // المبيعات (معتمد)
    let salesTot=0,salesCount=0,sysTot=0; const byBranch={};
    clo.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; const a=Number(x.actualSales)||0; salesTot+=a; sysTot+=Number(x.systemSales)||0; salesCount++; const b=x.branchName||"—"; byBranch[b]=(byBranch[b]||0)+a;});
    const days=Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)+1);
    const avgDaily=salesTot/days; const diff=salesTot-sysTot;
    // المشتريات (معتمد)
    let buyTot=0,buyCount=0; const bySupplier={};
    inv.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; const t=Number(x.total)||0; buyTot+=t; buyCount++; const s=x.supplier||"—"; bySupplier[s]=(bySupplier[s]||0)+t;});
    // المخزون (من مخزون الفروع)
    let stockVal=0,lowCount=0;
    try{
      const priceMap={},minMap={}; prods.forEach(d=>{const x=d.data();priceMap[d.id]=Number(x.price)||0;minMap[d.id]=Number(x.min)||0;});
      const bs=await cRef().collection("branchStock").get();
      bs.forEach(d=>{const x=d.data();const q=Number(x.qty)||0;stockVal+=q*(priceMap[x.productId]||0); if((minMap[x.productId]||0)>0 && q<=(minMap[x.productId]||0)) lowCount++;});
    }catch(e){}
    // التوالف (معتمد)
    let wasteTot=0; const byReason={};
    waste.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; const cst=Number(x.cost)||0; wasteTot+=cst; const r=x.reason||"أخرى"; byReason[r]=(byReason[r]||0)+cst;});
    // المصروفات (معتمد)
    let expTot=0; const byCat={};
    exps.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; const a=Number(x.amount)||0; expTot+=a; const cat=x.category||"أخرى"; byCat[cat]=(byCat[cat]||0)+a;});
    // صافي الربح = المبيعات − (المشتريات + المصروفات + التوالف)
    const netProfit=salesTot-(buyTot+expTot+wasteTot);
    // الرواتب (آخر شهر مسجّل) + التقييم
    let payrollTot=0; pay.forEach(d=>{const x=d.data(); payrollTot+=Number(x.net||x.total||0)||0;});
    let evSum=0,evN=0; evals.forEach(d=>{const x=d.data(); evSum+=Number(x.pct||0); evN++;});
    const kpicard=(t,v,color)=>"<div class='kpi'><div class='l'>"+t+"</div><div class='v'"+(color?" style='color:"+color+"'":"")+">"+v+"</div></div>";
    const rowsHtml=(obj,fmt)=>{const ks=Object.keys(obj).sort((a,b)=>obj[b]-obj[a]); if(!ks.length)return "<p class='muted'>لا توجد بيانات</p>"; return "<table><tbody>"+ks.map(k=>"<tr><td>"+esc(k)+"</td><td style='text-align:left'><b>"+fmt(obj[k])+"</b></td></tr>").join("")+"</tbody></table>";};
    body.innerHTML=
      "<h3 style='margin:6px 0 10px'>المبيعات</h3><div class='kpi-grid' style='margin-bottom:8px'>"+
        kpicard("إجمالي المبيعات (معتمد)",money(salesTot))+kpicard("عدد الإقفالات",salesCount)+
        kpicard("متوسط يومي",money(avgDaily))+kpicard("الفرق (فعلي−نظام)",money(diff),diff<0?"var(--red)":"var(--green)")+
      "</div><div class='card' style='margin-bottom:18px'><div class='muted' style='font-size:13px;margin-bottom:6px'>المبيعات حسب الفرع</div>"+rowsHtml(byBranch,money)+"</div>"+
      "<h3 style='margin:6px 0 10px'>المشتريات</h3><div class='kpi-grid' style='margin-bottom:8px'>"+
        kpicard("إجمالي المشتريات (معتمد)",money(buyTot))+kpicard("عدد الفواتير",buyCount)+
      "</div><div class='card' style='margin-bottom:18px'><div class='muted' style='font-size:13px;margin-bottom:6px'>المشتريات حسب المورد</div>"+rowsHtml(bySupplier,money)+"</div>"+
      "<h3 style='margin:6px 0 10px'>المخزون</h3><div class='kpi-grid' style='margin-bottom:18px'>"+
        kpicard("قيمة المخزون الحالية",money(stockVal))+kpicard("منتجات تحت الحد الأدنى",lowCount,lowCount>0?"var(--amber)":"")+
      "</div>"+
      "<h3 style='margin:6px 0 10px'>التوالف</h3><div class='kpi-grid' style='margin-bottom:8px'>"+
        kpicard("إجمالي تكلفة التوالف",money(wasteTot),wasteTot>0?"var(--red)":"")+
      "</div><div class='card' style='margin-bottom:18px'><div class='muted' style='font-size:13px;margin-bottom:6px'>التوالف حسب السبب</div>"+rowsHtml(byReason,money)+"</div>"+
      "<h3 style='margin:6px 0 10px'>المصروفات</h3><div class='kpi-grid' style='margin-bottom:8px'>"+
        kpicard("إجمالي المصروفات (معتمد)",money(expTot),expTot>0?"var(--red)":"")+
      "</div><div class='card' style='margin-bottom:18px'><div class='muted' style='font-size:13px;margin-bottom:6px'>المصروفات حسب الفئة</div>"+rowsHtml(byCat,money)+"</div>"+
      "<h3 style='margin:6px 0 10px'>صافي الربح</h3><div class='card' style='margin-bottom:18px;background:linear-gradient(160deg,var(--teal-deep,#2d4551),var(--ink,#18212b));color:#f3ede1'>"+
        "<div class='review-row' style='border-color:rgba(255,255,255,.15)'><span style='color:rgba(244,239,228,.75)'>المبيعات</span><b style='color:#fff'>"+money(salesTot)+"</b></div>"+
        "<div class='review-row' style='border-color:rgba(255,255,255,.15)'><span style='color:rgba(244,239,228,.75)'>− المشتريات</span><b style='color:#e3c98f'>"+money(buyTot)+"</b></div>"+
        "<div class='review-row' style='border-color:rgba(255,255,255,.15)'><span style='color:rgba(244,239,228,.75)'>− المصروفات</span><b style='color:#e3c98f'>"+money(expTot)+"</b></div>"+
        "<div class='review-row' style='border-color:rgba(255,255,255,.15)'><span style='color:rgba(244,239,228,.75)'>− التوالف</span><b style='color:#e3c98f'>"+money(wasteTot)+"</b></div>"+
        "<div class='review-row' style='border:0;padding-top:10px'><span style='font-weight:800'>صافي الربح</span><b style='font-size:22px;color:"+(netProfit>=0?"#7fd0a0":"#e8a09a")+"'>"+money(netProfit)+"</b></div>"+
      "</div>"+
      "<h3 style='margin:6px 0 10px'>الموظفون</h3><div class='kpi-grid'>"+
        kpicard("إجمالي الرواتب (آخر كشف)",money(payrollTot))+kpicard("متوسط تقييم الفروع",evN?Math.round(evSum/evN)+"%":"—")+
      "</div>";
    if(typeof translateTree==="function") translateTree(body);
  }catch(e){ console.error(e); body.innerHTML="<p style='color:var(--red)'>تعذّر تحميل التقارير</p>"; }
}

function renderModStateRows(){

async function setModuleVisibility(key,hide){
  if(moduleHidden(key)===hide) return; // لا تغيير
  const h=Object.assign({},HIDDEN); if(hide) h[key]=true; else delete h[key];
  try{
    await db.collection("platform").doc("config").set({hidden:h},{merge:true});
    HIDDEN=h;
    if(state.current==="super_maint") renderModStateRows();
    const mod=MODULES.find(x=>x.key===key)||{name:key};
    logAction("toggle_hidden",(hide?"إخفاء":"إظهار")+": "+mod.name);
    toast(hide?"أُخفي القسم عن الشركات":"أصبح القسم متاحاً","ok");
  }catch(e){ console.error(e); toast("تعذّر الحفظ — تحقّق من قواعد الأمان","err"); }
}
window.setModuleVisibility=setModuleVisibility;

// (مؤجّل) وضع الصيانة — يبقى بالكود للاستخدام لاحقاً
async function toggleMaintenance(key){
  const next=!moduleUnderMaintenance(key);
  const m=Object.assign({},MAINT); if(next) m[key]=true; else delete m[key];
  try{
    await db.collection("platform").doc("config").set({maintenance:m},{merge:true});
    MAINT=m;
    const mod=MODULES.find(x=>x.key===key)||{name:key};
    logAction("toggle_maintenance",(next?"تفعيل":"إيقاف")+" صيانة: "+mod.name);
    toast(next?"فُعّلت الصيانة على القسم":"أُلغيت الصيانة","ok");
  }catch(e){ console.error(e); toast("تعذّر الحفظ — تحقّق من قواعد الأمان","err"); }
}

function subscriptionModal(id,cd){
  const s=cd.subscription||{};
  const startVal=(toDate(s.startsAt)||new Date()).toISOString().slice(0,10);
  const months=s.months||1;
  openModal("اشتراك: "+esc(cd.name),
    "<label class='field'><span>تاريخ بداية الاشتراك</span><input id='subStart' class='input' type='date' value='"+startVal+"'></label>"+
    "<label class='field'><span>مدة الاشتراك (بالأشهر)</span><input id='subMonths' class='input' type='number' min='1' value='"+months+"'></label>"+
    "<div class='review-row'><span>تاريخ الانتهاء</span><b id='subEndPreview'>—</b></div>",
    "حفظ الاشتراك", async ()=>{
      const start=new Date($("subStart").value); const m=parseInt($("subMonths").value)||1;
      if(isNaN(start)){toast("اختر تاريخ البداية","err");return false;}
      const end=new Date(start); end.setMonth(end.getMonth()+m);
      await db.collection("companies").doc(id).update({
        subscription:{plan:"monthly",months:m,startsAt:start.toISOString(),endsAt:end.toISOString(),active:true},

// حذف الشركة وكل مجموعاتها الفرعية
async function deleteCompanyDeep(id){
  const ref=db.collection("companies").doc(id);
  const subs=["branches","users","dailyClosings","auditLog"];
  for(const sub of subs){
    const snap=await ref.collection(sub).get();
    // حذف على دفعات
    const docs=snap.docs;
    for(let i=0;i<docs.length;i+=400){
      const batch=db.batch();
      docs.slice(i,i+400).forEach(d=>{
        batch.delete(d.ref);
        if(sub==="users") batch.delete(db.collection("users").doc(d.id)); // إزالة الربط العلوي
      });
      await batch.commit();
    }
  }
  await ref.delete();
}

function openActionMenu(anchor, items){
  document.querySelectorAll(".actionMenuPop").forEach(m=>m.remove());
  const menu=document.createElement("div"); menu.className="actionMenuPop";
  menu.style.cssText="position:fixed;z-index:10000;background:var(--card,#fff);border:1px solid var(--line,#e4e8f0);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;min-width:150px;display:flex;flex-direction:column;gap:2px";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.textContent=it.label;
    b.style.cssText="text-align:start;background:none;border:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:"+(it.danger?"var(--red)":"inherit");
    b.onmouseenter=()=>b.style.background="var(--line,#eef1f5)";
    b.onmouseleave=()=>b.style.background="none";
    b.onclick=(e)=>{ e.stopPropagation(); menu.remove(); it.fn(); };
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const r=anchor.getBoundingClientRect();
  let top=r.bottom+6, left=r.left;
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  if(left+mw>window.innerWidth-8) left=window.innerWidth-mw-8;
  if(left<8) left=8;
  if(top+mh>window.innerHeight-8) top=r.top-mh-6;
  menu.style.top=top+"px"; menu.style.left=left+"px";
  const close=(e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener("click",close); document.removeEventListener("scroll",close,true); } };
  setTimeout(()=>{ document.addEventListener("click",close); document.addEventListener("scroll",close,true); },10);
}

// نطاق الشهر الحالي/الماضي كنصوص YYYY-MM-DD
function monthRange(offset){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+(offset||0));
  const start=d.toISOString().slice(0,10);
  const n=new Date(d); n.setMonth(n.getMonth()+1);
  const next=n.toISOString().slice(0,10);
  return {start,next};
}
// البطاقات القابلة للإضافة (من الأقسام المبنية حالياً — تكبر مع بناء الأقسام)
const DASH_WIDGETS = {
  sales_month:     { name:"مبيعات الشهر", icon:"", page:"sales" },
  prev_month_sales:{ name:"مبيعات الشهر الماضي", icon:"📉", page:"sales" },
  closings_month:  { name:"عدد إقفالات الشهر", icon:"", page:"sales" },
  avg_closing:     { name:"متوسط قيمة الإقفال", icon:"", page:"sales" },
  branches_count:  { name:"عدد الفروع", icon:"", page:"branches" },
  users_count:     { name:"عدد الموظفين", icon:"", page:"staff" },
  invoices_count:  { name:"عدد المشتريات (الشهر)", icon:"", page:"invoices" },
  invoices_total:  { name:"إجمالي المشتريات (الشهر)", icon:"🛒", page:"invoices" },
  inventory_count: { name:"عدد المنتجات", icon:"", page:"inventory" },
  inventory_value: { name:"قيمة المخزون", icon:"", page:"inventory" },
  inventory_low:   { name:"منتجات تحتاج طلب", icon:"", page:"inventory" }
};
let dashReorder=false;

function pageDashboard(c){
  // الموظف لا يرى أرقام المبيعات
  if(isEmployeeView()){
    c.innerHTML=pageTitle("لوحة التحكم","أهلاً "+esc(state.profile.name||""))+
      "<div class='card center' style='flex-direction:column;gap:10px;padding:40px'><div style='font-size:40px'>👋</div>"+
      "<p class='muted'>استخدم قسم «الإقفال اليومي» لإرسال إقفالك.</p></div>";
    return;
  }
  const prefs=(state.profile&&state.profile.dashboardPrefs)||{compare:false,cards:[]};
  const compare=!!prefs.compare;
  const cards=Array.isArray(prefs.cards)?prefs.cards:[];

  // شريط الأدوات
  let html=pageTitle("لوحة التحكم","نظرة على "+state.companyName);
  html+="<div style='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px'>"+
    "<button class='btn sm' id='addCardBtn'>+ إضافة بطاقة</button>"+
    "<button class='btn sm' id='orderBtn'>"+(dashReorder?"✓ تم":"⇅ ترتيب البطاقات")+"</button>"+
    "<button class='btn sm' id='cmpBtn'>"+(compare?"✓ ":"")+"مقارنة بالشهر الماضي</button>"+
    "</div>";
  html+="<div class='kpi-grid' id='kpis'>";
  // بطاقة المقارنة (تلقائية عند التفعيل)
  if(compare){
    html+="<div class='kpi' style='border-color:var(--brand)'><div class='l'>مقارنة بالشهر الماضي</div><div class='v' id='salesDelta' style='font-size:18px'>—</div></div>";
  }
  // البطاقات المختارة فقط
  cards.forEach((k,i)=>{ const w=DASH_WIDGETS[k]; if(!w) return;
    let ctrls="";
    if(dashReorder){
      ctrls="<div style='position:absolute;top:6px;left:6px;display:flex;gap:4px'>"+
        "<button class='dmove' data-dir='-1' data-i='"+i+"' style='background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;padding:2px 8px'>→</button>"+
        "<button class='dmove' data-dir='1' data-i='"+i+"' style='background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;padding:2px 8px'>←</button>"+
        "<button class='drm' data-rm='"+k+"' style='background:none;border:none;color:var(--red);cursor:pointer;font-size:18px'>×</button></div>";
    }
    html+="<div class='kpi' data-w='"+k+"' style='"+(dashReorder?"":"cursor:pointer;")+"position:relative'>"+ctrls+
      "<div class='l'>"+(w.icon?w.icon+" ":"")+esc(w.name)+"</div><div class='v' id='w_"+k+"'>—</div></div>";
  });
  html+="</div>";
  if(!cards.length && !compare) html+="<div class='card muted' style='text-align:center;padding:30px'>لوحتك فاضية — اضغط «+ إضافة بطاقة» لتخصيصها.</div>";
  c.innerHTML=html;

  // الأحداث
  $("addCardBtn").onclick=()=>addCardModal(cards);
  $("orderBtn").onclick=()=>{ dashReorder=!dashReorder; pageDashboard(c); };
  $("cmpBtn").onclick=()=>saveDashPrefs({compare:!compare,cards});
  if(!dashReorder){
    c.querySelectorAll(".kpi[data-w]").forEach(el=>{ el.onclick=()=>openPage(DASH_WIDGETS[el.dataset.w].page); });
  }else{
    c.querySelectorAll(".dmove").forEach(b=>b.onclick=()=>{
      const i=parseInt(b.dataset.i), dir=parseInt(b.dataset.dir), j=i+dir;
      if(j<0||j>=cards.length) return; const nc=cards.slice(); const t=nc[i];nc[i]=nc[j];nc[j]=t;
      saveDashPrefs({compare,cards:nc});
    });
    c.querySelectorAll(".drm").forEach(b=>b.onclick=()=>saveDashPrefs({compare,cards:cards.filter(x=>x!==b.dataset.rm)}));
  }

  // ===== تغذية البيانات حسب البطاقات المختارة =====
  const cur=monthRange(0), prev=monthRange(-1);
  const needCur = compare || cards.some(k=>["sales_month","closings_month","avg_closing"].includes(k));
  if(needCur){
    cRef().collection("dailyClosings").where("date",">=",cur.start).where("date","<",cur.next).onSnapshot(s=>{
      let sum=0,count=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; sum+=Number(x.actualSales)||0;count++;});
      if($("w_sales_month"))$("w_sales_month").textContent=money(sum);
      if($("w_closings_month"))$("w_closings_month").textContent=count;
      if($("w_avg_closing"))$("w_avg_closing").textContent=money(count?sum/count:0);
      window.__curMonthSales=sum; if(compare) updateDelta();
    },()=>{});
  }
  if(compare || cards.includes("prev_month_sales")){
    cRef().collection("dailyClosings").where("date",">=",prev.start).where("date","<",prev.next).onSnapshot(s=>{
      let sum=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; sum+=Number(x.actualSales)||0;});
      window.__prevMonthSales=sum;
      if($("w_prev_month_sales"))$("w_prev_month_sales").textContent=money(sum);
      if(compare) updateDelta();
    },()=>{});
  }
  if(cards.includes("branches_count")){
    cRef().collection("branches").onSnapshot(s=>{if($("w_branches_count"))$("w_branches_count").textContent=s.size;},()=>{});
  }
  if(cards.includes("users_count")){
    cRef().collection("employees").onSnapshot(s=>{if($("w_users_count"))$("w_users_count").textContent=s.size;},()=>{});
  }
  if(cards.includes("invoices_count")||cards.includes("invoices_total")){
    cRef().collection("invoices").where("date",">=",cur.start).where("date","<",cur.next).onSnapshot(s=>{
      let total=0,count=0; s.forEach(d=>{const x=d.data(); if(x.status!=="approved")return; total+=Number(x.total)||0;count++;});
      if($("w_invoices_count"))$("w_invoices_count").textContent=count;
      if($("w_invoices_total"))$("w_invoices_total").textContent=money(total);
    },()=>{});
  }
  if(cards.includes("inventory_count")||cards.includes("inventory_value")||cards.includes("inventory_low")){
    cRef().collection("products").onSnapshot(async s=>{
      if($("w_inventory_count"))$("w_inventory_count").textContent=s.size;
      const priceMap={},minMap={}; s.forEach(d=>{const x=d.data();priceMap[d.id]=Number(x.price)||0;minMap[d.id]=Number(x.min)||0;});
      try{
        const bs=await cRef().collection("branchStock").get();
        let val=0,low=0; bs.forEach(d=>{const x=d.data();const q=Number(x.qty)||0;val+=q*(priceMap[x.productId]||0); if((minMap[x.productId]||0)>0 && q<=(minMap[x.productId]||0)) low++;});
        if($("w_inventory_value"))$("w_inventory_value").textContent=money(val);
        if($("w_inventory_low"))$("w_inventory_low").textContent=low;
      }catch(e){}
    },()=>{});
  }
}

// حساب وعرض نسبة التغيّر عن الشهر الماضي
function updateDelta(){
  const el=$("salesDelta"); if(!el) return;
  const cur=window.__curMonthSales, prev=window.__prevMonthSales;
  if(cur==null||prev==null) return;
  if(prev===0){ el.textContent=cur>0?"▲ جديد هذا الشهر":"—"; el.style.color="var(--green)"; return; }
  const pct=((cur-prev)/prev)*100;
  const up=pct>=0;
  el.textContent=(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"% عن الشهر الماضي";
  el.style.color=up?"var(--green)":"var(--red)";
}

function addCardModal(current){
  const avail=Object.keys(DASH_WIDGETS).filter(k=>!current.includes(k));
  if(!avail.length){ toast("أضفت كل البطاقات المتاحة حالياً","");return; }
  const body=avail.map(k=>{const w=DASH_WIDGETS[k];
    return "<label class='field' style='display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px'>"+
      "<input type='checkbox' value='"+k+"'><span>"+(w.icon?w.icon+" ":"")+esc(w.name)+"</span></label>";
  }).join("")+"<p class='muted' style='font-size:13px'>تُضاف بطاقات الأقسام الجاهزة الآن، وتزيد الخيارات كلما بُني قسم جديد.</p>";
  openModal("إضافة بطاقة",body,"إضافة",()=>{
    const picked=[...document.querySelectorAll("#modalRoot input:checked")].map(x=>x.value);
    if(!picked.length){toast("اختر بطاقة واحدة على الأقل","err");return false;}
    saveDashPrefs({compare:!!(state.profile.dashboardPrefs&&state.profile.dashboardPrefs.compare),cards:current.concat(picked)});
    return true;
  });
}

// الموظف = يستطيع الإضافة لكن لا يعتمد (لا يرى الأرقام ولا سجل الإقفالات)
function isEmployeeView(){ return state.role==="employee" || (can("sales","add") && !can("sales","approve")); }
function canApproveSales(){ return can("sales","approve")||state.role==="owner"||state.role==="manager"; }
function statusTag3(st){ return st==="approved"?"<span class='tag green'>"+L("تم الاعتماد")+"</span>":st==="rejected"?"<span class='tag red'>"+L("مرفوضة")+"</span>":"<span class='tag amber'>"+L("قيد المراجعة")+"</span>"; }
// زر الحالة الذكي: يعرض الحالة بلونها، وضغطه يفتح قائمة الخيارات (معاينة/اعتماد/رفض/حذف)
// opts: { onView, onApprove, onReject, onDelete, canDelete }
function statusActionBtn(status, opts){
  opts=opts||{};
  const isPending=(status!=="approved"&&status!=="rejected");
  const label = isPending ? L("قيد المراجعة") : (status==="approved"?L("تم الاعتماد"):L("مرفوضة"));
  const cls = status==="approved" ? "green" : status==="rejected" ? "red" : "amber";
  const b=el("button","btn sm status-act "+cls, label);
  b.onclick=(e)=>{ e.stopPropagation();
    const items=[];
    if(opts.onView) items.push({label:L("معاينة"), fn:opts.onView});
    if(!isPending){
      if(status!=="approved" && opts.onApprove) items.push({label:L("اعتماد"), fn:opts.onApprove});
      if(status!=="rejected" && opts.onReject) items.push({label:L("رفض"), danger:true, fn:opts.onReject});
      if(opts.canDelete && opts.onDelete) items.push({label:L("حذف"), danger:true, fn:opts.onDelete});
    }
    openActionMenu(b, items);
  };
  return b;
}
function fmtDT(ts){ try{ const d=ts&&ts.toDate?ts.toDate():null; if(!d)return "—"; const loc=(LANG==="en"?"en-GB":"ar-SA-u-ca-gregory-nu-latn"); return d.toLocaleDateString(loc)+" "+d.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"}); }catch(e){return "—";} }

/* ===== عدّاد عدد الصفوف الظاهرة (لأي قائمة طويلة) ===== */
const PAGE_SIZES=[10,20,30,100];
// يبني زر عدّاد صغير يعرض العدد الحالي، وتغييره يستدعي onChange بالقيمة الجديدة
function pageSizeControl(current,onChange){
  const wrap=el("div"); wrap.style.cssText="display:block;width:100%;margin-bottom:10px;text-align:right";
  const btn=el("button","btn sm",""+current); btn.style.cssText="padding:5px 12px;min-width:52px";
  btn.title=L("عدد الظاهر");
  btn.onclick=(e)=>{ e.stopPropagation(); openActionMenu(btn, PAGE_SIZES.map(n=>({label:""+n, fn:()=>onChange(n)}))); };
  wrap.appendChild(btn);
  return wrap;
}

// تحديث حالة الإقفال (اعتماد/رفض) + سجل
function setClosingStatus(id,x,st){
  cRef().collection("dailyClosings").doc(id).update({status:st,approvedBy:state.user.uid,approvedAt:now()});
  logAction(st==="approved"?"approve_closing":"reject_closing",(x.date||"")+" / "+(x.branchName||""));
}
// حذف الإقفال (لمالك المنصة/صاحب الشركة فقط)
function canDeleteClosing(){ return state.role==="super"||state.role==="owner"||impersonation.active; }
function deleteClosing(id,x){
  if(!confirm(L("حذف الإقفال نهائياً؟"))) return;
  cRef().collection("dailyClosings").doc(id).delete().then(()=>{ logAction("delete_closing",(x.date||"")+" / "+(x.branchName||"")); toast(L("تم الحذف"),"ok"); }).catch(()=>toast(L("تعذّر الحذف"),"err"));
}
window.setClosingStatus=setClosingStatus; window.deleteClosing=deleteClosing;

function pageSales(c){
  const canApp=canApproveSales();
  c.innerHTML=pageTitle("الإقفال اليومي", canApp?"مراجعة واعتماد إقفالات المبيعات":"إرسال إقفال المبيعات");
  const bar=el("div",null,"<button class='btn primary' id='newClosingBtn'>+ إرسال إقفال</button>"); bar.style.marginBottom="16px"; c.appendChild(bar);
  $("newClosingBtn").onclick=openClosingModal;

  if(!canApp){
    // ===== الموظف: جدول «طلباتي» (بدون أرقام) =====
    const card=el("div","card");
    card.innerHTML="<h3 style='margin-bottom:10px'>طلباتي</h3><table><thead><tr><th>التاريخ والوقت</th><th>الحالة</th></tr></thead><tbody id='myClo'><tr><td colspan='2' class='muted'>جارٍ التحميل…</td></tr></tbody></table>";
    c.appendChild(card);
    cRef().collection("dailyClosings").where("employeeUid","==",state.user.uid).onSnapshot(s=>{
      const tb=$("myClo");if(!tb)return;const rows=[];s.forEach(d=>rows.push(d.data()));
      rows.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
      tb.innerHTML=rows.length?"":"<tr><td colspan='2' class='muted'>لا توجد إقفالات مُرسلة</td></tr>";
      rows.forEach(x=>tb.appendChild(el("tr",null,"<td>"+fmtDT(x.createdAt)+"</td><td>"+statusTag3(x.status)+"</td>")));
    },()=>{const tb=$("myClo");if(tb)tb.innerHTML="<tr><td colspan='2' style='color:var(--red)'>تعذّر التحميل</td></tr>";});
    return;
  }

  // ===== المالك/المدير: سجل كامل + زر إجراء ذكي + عدّاد =====
  if(window.__cloLimit==null) window.__cloLimit=10;
  const counter=pageSizeControl(window.__cloLimit,(n)=>{ window.__cloLimit=n; pageSales(c); });
  c.appendChild(counter);
  const card=el("div","card");
  card.innerHTML="<table><thead><tr><th>التاريخ والوقت</th><th>الفرع</th><th>المُرسِل</th><th>الحالة</th></tr></thead><tbody id='clRows'><tr><td colspan='4' class='muted'>جارٍ التحميل…</td></tr></tbody></table>";
  c.appendChild(card);
  cRef().collection("dailyClosings").orderBy("createdAt","desc").limit(window.__cloLimit).onSnapshot(s=>{
    const tb=$("clRows");if(!tb)return;tb.innerHTML="";
    if(s.empty){tb.innerHTML="<tr><td colspan='4' class='muted'>لا توجد إقفالات</td></tr>";return;}
    s.forEach(d=>{const x=d.data();
      const tr=el("tr",null,"<td>"+fmtDT(x.createdAt)+"</td><td>"+esc(x.branchName||"—")+"</td><td>"+esc(x.employeeName)+"</td><td></td>");
      const b=statusActionBtn(x.status,{
        onView:()=>viewClosing(d.id,x),
        onApprove:()=>setClosingStatus(d.id,x,"approved"),
        onReject:()=>setClosingStatus(d.id,x,"rejected"),
        onDelete:()=>deleteClosing(d.id,x),
        canDelete:canDeleteClosing()
      });
      tr.lastChild.appendChild(b);
      tb.appendChild(tr);
    });
  },()=>{const tb=$("clRows");if(tb)tb.innerHTML="<tr><td colspan='4' style='color:var(--red)'>تعذّر التحميل</td></tr>";});
}
// عرض تفاصيل الإقفال (للإدارة، بدون تعديل)
function viewClosing(id,x){
  const showVar=canApproveSales();
  const vRow=(t,val)=>"<div class='review-row'><span>"+t+"</span><b style='color:"+(val>0?"var(--green)":val<0?"var(--red)":"inherit")+"'>"+(val>0?"+":"")+money(val)+"</b></div>";
  // إقفال جديد (فيه net) أم قديم (فيه actualSales فقط)
  const isNew = x.net!=null || x.orders!=null || x.cashSys!=null;
  let inner="<div class='review-row'><span>التاريخ والوقت</span><b>"+fmtDT(x.createdAt)+"</b></div>"+
    "<div class='review-row'><span>المُرسِل</span><b>"+esc(x.employeeName)+"</b></div>";
  if(isNew){
    const net=Number(x.net)||0, orders=Number(x.orders)||0, at=Number(x.at)|| (orders>0?net/orders:0);
    const cashSys=Number(x.cashSys)||0, cashPhy=Number(x.cashPhy)||0;
    const cardSys=Number(x.cardSys)||0, cardPhy=Number(x.cardPhy)|| ((Number(x.mada)||0)+(Number(x.visa)||0)+(Number(x.mastercard)||0));
    inner+="<div class='sec-title' style='margin:12px 0 4px'>المبيعات</div>"+
      "<div class='review-row'><span>صافي المبيعات</span><b>"+money(net)+"</b></div>"+
      "<div class='review-row'><span>عدد الطلبات</span><b>"+orders+"</b></div>"+
      "<div class='review-row'><span>متوسط الفاتورة</span><b>"+money(at)+"</b></div>"+
      "<div class='sec-title' style='margin:12px 0 4px'>الكاش</div>"+
      "<div class='review-row'><span>النظام / الفعلي</span><b>"+money(cashSys)+" · "+money(cashPhy)+"</b></div>"+
      (showVar?vRow("الفرق",cashPhy-cashSys):"")+
      "<div class='sec-title' style='margin:12px 0 4px'>الشبكة</div>"+
      "<div class='review-row'><span>النظام</span><b>"+money(cardSys)+"</b></div>"+
      "<div class='review-row'><span>مدى / فيزا / ماستر</span><b>"+money(x.mada)+" · "+money(x.visa)+" · "+money(x.mastercard)+"</b></div>"+
      "<div class='review-row'><span>مجموع الفعلي</span><b>"+money(cardPhy)+"</b></div>"+
      (showVar?vRow("الفرق",cardPhy-cardSys):"")+
      "<div class='review-row' style='margin-top:8px'><span>أونلاين</span><b>"+money(x.online)+"</b></div>";
  } else {
    const diff=(Number(x.actualSales)||0)-(Number(x.systemSales)||0);
    const paySum=(Number(x.cash)||0)+(Number(x.mada)||0)+(Number(x.visa)||0)+(Number(x.mastercard)||0);
    inner+="<div class='review-row'><span>المبيعات الفعلية</span><b>"+money(x.actualSales)+"</b></div>"+
      "<div class='review-row'><span>مبيعات النظام</span><b>"+money(x.systemSales)+"</b></div>"+
      (showVar?"<div class='review-row'><span>الفرق</span><b style='color:"+(diff===0?"var(--green)":"var(--amber)")+"'>"+money(diff)+"</b></div>":"")+
      "<div class='review-row'><span>الكاش / مدى / فيزا / ماستر</span><b>"+money(x.cash)+" · "+money(x.mada)+" · "+money(x.visa)+" · "+money(x.mastercard)+"</b></div>"+
      "<div class='review-row'><span>مجموع الدفعات</span><b>"+money(paySum)+"</b></div>";
  }
  inner+="<div class='review-row'><span>الحالة</span>"+statusTag3(x.status)+"</div>"+
    (x.photoUrl?"<div style='margin-top:10px'><div class='muted' style='font-size:13px;margin-bottom:6px'>صورة الإقفال</div><img src='"+x.photoUrl+"' style='max-width:100%;border-radius:10px;border:1px solid var(--line)'></div>":"");
  const isPending=(x.status!=="approved"&&x.status!=="rejected");
  const canApp=canApproveSales();
  if(isPending && canApp){
    // إقفال جديد: زرّا الاعتماد والرفض داخل المعاينة — بعد الاختيار يتحدّث الجدول تلقائياً
    inner+="<div style='display:flex;gap:10px;margin-top:18px'>"+
      "<button class='btn primary' id='clApprove' style='flex:1'>"+esc(L("اعتماد"))+"</button>"+
      "<button class='btn danger' id='clReject' style='flex:1'>"+esc(L("رفض"))+"</button>"+
    "</div>";
    openModal("تفاصيل الإقفال — "+esc(x.branchName||""), inner, null, ()=>true, true);
    setTimeout(()=>{
      if($("clApprove"))$("clApprove").onclick=()=>{ setClosingStatus(id,x,"approved"); closeModal(); toast(L("تم الاعتماد"),"ok"); };
      if($("clReject"))$("clReject").onclick=()=>{ setClosingStatus(id,x,"rejected"); closeModal(); toast(L("تم الرفض"),"ok"); };
    },30);
    return;
  }
  openModal("تفاصيل الإقفال — "+esc(x.branchName||""), inner, "تم",()=>true,true);
}

// بطاقة تأكيد مؤقتة تظهر للموظف بعد الإرسال وتختفي بعد 5 دقائق
function showEmployeeConfirmation(){
  const wrap=$("empTempWrap"); if(!wrap) return;
  const hint=$("empHint"); if(hint) hint.classList.add("hidden");
  const card=el("div","card");
  card.style.borderColor="var(--green)";
  const until=Date.now()+5*60*1000;
  card.innerHTML="<div style='display:flex;align-items:center;gap:10px'><span style='font-size:22px'>✅</span>"+
    "<div><div style='font-weight:700'>تم إرسال الإقفال بنجاح</div>"+
    "<div class='muted' style='font-size:13px'>سُجّل الإقفال وأُرسل للإدارة. هذا التأكيد يختفي خلال <b class='cd'>5:00</b></div></div></div>";
  wrap.prepend(card);
  const cd=card.querySelector(".cd");
  const timer=setInterval(()=>{
    const left=Math.max(0,Math.round((until-Date.now())/1000));
    const m=Math.floor(left/60), s=String(left%60).padStart(2,"0");
    if(cd) cd.textContent=m+":"+s;
    if(left<=0){ clearInterval(timer); card.style.transition=".4s"; card.style.opacity="0";
      setTimeout(()=>{ card.remove(); if(hint && !wrap.children.length) hint.classList.remove("hidden"); },400); }
  },1000);
}

        "<label class='field'><span>الفعلي</span><input id='clCashPhy' class='input clc' type='number' inputmode='decimal' placeholder='0.00'></label>"+

      "<label class='field'><span>النظام</span><input id='clCardSys' class='input clc' type='number' inputmode='decimal' placeholder='0.00'></label>"+
      "<div class='muted' style='font-size:13px;margin-bottom:6px'>الفعلي</div>"+

        "<label class='field'><span>فيزا</span><input id='clVisa' class='input clc' type='number' inputmode='decimal' placeholder='0.00'></label>"+
        "<label class='field'><span>ماستركارد</span><input id='clMaster' class='input clc' type='number' inputmode='decimal' placeholder='0.00'></label>"+

      "<div class='review-row' style='border:0;padding:2px 0 0'><span>مجموع الفعلي</span><b id='clCardPhy'>0.00</b></div>"+
      (showVar?"<div class='review-row' style='border:0;padding:2px 0 0'><span>الفرق</span><b id='clCardVar'>0.00</b></div>":"")+

function reviewClosing(){
  const g=id=>$(id)?$(id).value:"";
  const v=id=>parseFloat(g(id))||0;
  const branchSel=$("clBranch"); const branchName=branchSel&&branchSel.selectedOptions[0]?branchSel.selectedOptions[0].textContent:"";
  const net=v("clNet"), orders=parseInt(g("clOrders"))||0;
  const cashSys=v("clCashSys"), cashPhy=v("clCashPhy");
  const cardSys=v("clCardSys"), mada=v("clMada"), visa=v("clVisa"), mastercard=v("clMaster");
  const cardPhy=mada+visa+mastercard;
  const online=v("clOnline");
  const at=orders>0?net/orders:0;
  const cashVar=cashPhy-cashSys, cardVar=cardPhy-cardSys;
  const actualSales=cashPhy+cardPhy+online; // المبيعات الفعلية = مجموع المقبوضات الفعلية
  const data={branchId:branchSel?branchSel.value:"",branchName,
    net, orders, at, cashSys, cashPhy, cashVar,
    cardSys, mada, visa, mastercard, cardPhy, cardVar,
    online, actualSales:net, receiptsTotal:(cashPhy+cardPhy+online), systemSales:net};
  const file=$("clPhoto").files[0];
  if(!data.branchId){toast("اختر الفرع","err");return false;}
  if(!g("clNet")){toast("أدخل صافي المبيعات","err");return false;}
  if(!file){toast("أرفق صورة الإقفال","err");return false;}
  const vRow=(t,val)=>"<div class='review-row'><span>"+t+"</span><b style='color:"+(val>0?"var(--green)":val<0?"var(--red)":"inherit")+"'>"+(val>0?"+":"")+money(val)+"</b></div>";
  if(!canApproveSales()){
    openModal("تأكيد الإرسال",
      "<div class='review-row'><span>الفرع</span><b>"+esc(branchName)+"</b></div>"+
      "<div class='review-row'><span>صافي المبيعات</span><b>"+money(net)+"</b></div>"+
      "<div class='review-row'><span>عدد الطلبات</span><b>"+orders+"</b></div>"+
      "<div class='review-row'><span>متوسط الفاتورة</span><b>"+money(at)+"</b></div>"+
      "<p class='muted' style='margin-top:12px;font-size:14px'>تأكّد من البيانات. تُسجّل تلقائياً بالتاريخ والوقت واسمك وتُرسل للإدارة.</p>",
      "إرسال الإقفال", ()=>submitClosing(data,file));
    return false;
  }
  openModal("مراجعة الإقفال",
    "<div class='review-row'><span>الفرع</span><b>"+esc(branchName)+"</b></div>"+
    "<div class='sec-title' style='margin:12px 0 4px'>المبيعات</div>"+
    "<div class='review-row'><span>صافي المبيعات</span><b>"+money(net)+"</b></div>"+
    "<div class='review-row'><span>عدد الطلبات</span><b>"+orders+"</b></div>"+

async function submitClosing(data,file){

      date:new Date().toISOString().slice(0,10),
      employeeUid:state.user.uid, employeeName:state.profile.name||state.user.email,
      status:"pending", createdAt:now()});

  c.appendChild(filtWrap);

  cRef().collection("products").get().then(s=>{ s.forEach(d=>{const x=d.data(); if(x.name) nameCat[x.name]=x.category||"";}); });
  if(window.__invLimit==null) window.__invLimit=10;

    let total=0,count=0; s.forEach(d=>{const x=d.data(); if(x.status==="approved"){total+=Number(x.total)||0;count++;}});
    if($("invCount"))$("invCount").textContent=count; if($("invTotal"))$("invTotal").textContent=money(total);
  },()=>{});
  let allInv=[];
  const renderInv=()=>{
    const tb=$("invRows");if(!tb)return; const filter=($("invCatFilter")&&$("invCatFilter").value)||"";
    const rows=allInv.filter(x=>{ if(!filter)return true; return (x.items||[]).some(it=>(nameCat[it.name]||"")===filter); });
    tb.innerHTML=""; if(!rows.length){tb.innerHTML="<tr><td colspan='5' class='muted'>لا توجد فواتير</td></tr>";return;}

function collectInvoice(){
  const rows=[...document.querySelectorAll("#invItems .inv-item")];
  const items=[]; let total=0;
  for(const r of rows){
    const name=r.querySelector(".inv-name").value.trim();
    const value=parseFloat(r.querySelector(".inv-val").value)||0;
    const qty=parseFloat(r.querySelector(".inv-qty").value)||0;
    if(!name||value<=0||qty<=0) return {error:true};
    items.push({name,value,qty,lineTotal:value*qty}); total+=value*qty;
  }
  return {items,total,
    supplier:$("invSupplier")?$("invSupplier").value.trim():"",
    supplierPhone:$("invSupPhone")?$("invSupPhone").value.trim():""};
}

function reviewInvoice(){
  const data=collectInvoice();
  if(data.error||!data.items.length){toast("أكمل بيانات كل منتج (اسم، قيمة، كمية)","err");return false;}
  const file=$("invPhoto")?$("invPhoto").files[0]:null;
  data._file=file;
  // الموظف: تأكيد بلا أرقام
  if(invoiceEmployeeView()){
    openModal("تأكيد الفاتورة",
      "<div class='review-row'><span>عدد المنتجات</span><b>"+data.items.length+"</b></div>"+
      "<p class='muted' style='margin-top:12px;font-size:14px'>تأكّد من البيانات قبل الحفظ. تُسجّل تلقائياً بالتاريخ والوقت واسمك.</p>",
      "حفظ الفاتورة", ()=>submitInvoice(data));
    return false;
  }
  // المالك/المدير: تفاصيل كاملة
  openModal("مراجعة الفاتورة",
    data.items.map(it=>"<div class='review-row'><span>"+esc(it.name)+" ("+it.value+"×"+it.qty+")</span><b>"+money(it.lineTotal)+"</b></div>").join("")+
    "<div class='review-row'><span>المورد</span><b>"+(esc(data.supplier)||"—")+(data.supplierPhone?" · "+esc(data.supplierPhone):"")+"</b></div>"+
    "<div class='review-row'><span>الإجمالي</span><b style='color:var(--brand-2)'>"+money(data.total)+"</b></div>"+
    "<p class='muted' style='margin-top:10px;font-size:13px'>"+(file?"أرفقت الصورة ✅":"بدون صورة")+"</p>",
    "حفظ الفاتورة", ()=>submitInvoice(data));
  return false;
}

async function submitInvoice(data){
  try{
    const ref=cRef().collection("invoices").doc();
    let photoUrl="";
    if(data._file){ photoUrl=await compressToBase64(data._file); if(!photoUrl) toast("تعذّرت معالجة الصورة، حُفظت بدونها",""); }
    await ref.set({
      items:data.items.map(({name,value,qty,lineTotal})=>({name,value,qty,lineTotal})),
      total:data.total, supplier:data.supplier||"", supplierPhone:data.supplierPhone||"",
      photoUrl, photoPath:"", date:new Date().toISOString().slice(0,10),
      employeeUid:state.user.uid, employeeName:state.profile.name||state.user.email,
      createdBy:state.user.uid, createdByName:state.profile.name||state.user.email,
      status:"pending", createdAt:now()
    });
    logAction("add_invoice",(data.items[0]?data.items[0].name:"")+(data.items.length>1?" +"+(data.items.length-1):""));
    toast("تم إرسال الفاتورة بنجاح","ok");
    return true;
  }catch(e){console.error(e);toast("تعذّر حفظ الفاتورة","err");return false;}
}

// بطاقة تأكيد مؤقتة للموظف (5 دقائق) بعد حفظ الفاتورة
function showInvoiceConfirmation(){
  const wrap=$("invTempWrap"); if(!wrap) return;
  const hint=$("invHint"); if(hint) hint.classList.add("hidden");
  const card=el("div","card"); card.style.borderColor="var(--green)";
  const until=Date.now()+5*60*1000;
  card.innerHTML="<div style='display:flex;align-items:center;gap:10px'><span style='font-size:22px'>✅</span>"+
    "<div><div style='font-weight:700'>تم حفظ الفاتورة</div>"+
    "<div class='muted' style='font-size:13px'>سُجّلت وأُرسلت للإدارة. يختفي هذا التأكيد خلال <b class='cd'>5:00</b></div></div></div>";
  wrap.prepend(card);
  const cd=card.querySelector(".cd");
  const t=setInterval(()=>{ const left=Math.max(0,Math.round((until-Date.now())/1000));
    const m=Math.floor(left/60),s=String(left%60).padStart(2,"0"); if(cd)cd.textContent=m+":"+s;
    if(left<=0){clearInterval(t);card.style.transition=".4s";card.style.opacity="0";
      setTimeout(()=>{card.remove(); if(hint&&!wrap.children.length)hint.classList.remove("hidden");},400);}
  },1000);
}

  const trWrap=el("div","tr-wrap");

  tr.innerHTML="<div class='t'>"+esc(L("التحويلات"))+"</div><div class='d'>"+esc(L("تحويل بين المستودعات والفروع"))+"</div>"+
    "<span id='invTrBadge' style='position:absolute;top:10px;left:10px;background:var(--red);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px'></span>";
  tr.onclick=()=>transfersHub(c,()=>{ openPage("inventory"); });
  trWrap.appendChild(tr); c.appendChild(trWrap);

  // قسم الفروع — تظهر تلقائياً (٣ في صف، أصغر) عند وجود فروع
  const brSection=el("div"); brSection.id="invBrSection"; brSection.style.display="none";
  brSection.innerHTML="<div class='section-label animin' style='animation-delay:.28s'>"+esc(L("الفروع"))+"</div><div class='branches-row' id='invBrRow'></div>";
  c.appendChild(brSection);

  // شارة التحويلات المعلّقة
  if(canApproveTransfer()){
    cRef().collection("transfers").onSnapshot(s=>{ let n=0; s.forEach(d=>{const st=d.data().status; if(st!=="approved"&&st!=="rejected")n++;}); const b=$("invTrBadge"); if(b){ if(n){b.textContent=n;b.style.display="flex";}else b.style.display="none"; } },()=>{});
  }

  // تحميل الفروع (بدون المستودعات) وعرضها كبطاقات صغيرة
  cRef().collection("branches").orderBy("name").onSnapshot(async s=>{
    const row=$("invBrRow"); const sec=$("invBrSection"); if(!row||!sec) return;
    const branchDocs=[]; s.forEach(d=>{ if(!d.data().isWarehouse) branchDocs.push(d); });
    if(!branchDocs.length){ sec.style.display="none"; row.innerHTML=""; return; }
    sec.style.display="block"; row.innerHTML="";
    // متوسط تقييم كل فرع
    const evalsSnap=await cRef().collection("branchEvals").get().catch(()=>null);
    const byBranch={}; if(evalsSnap) evalsSnap.forEach(d=>{const x=d.data();(byBranch[x.branchId]=byBranch[x.branchId]||[]).push(x.pct||0);});
    branchDocs.forEach((d,i)=>{ const x=d.data();
      const arr=byBranch[d.id]||[]; const avg=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
      const stars=Math.round(avg/20);
      let starHtml=""; for(let k=1;k<=5;k++) starHtml+="<span style='color:"+(k<=stars?"var(--brand)":"var(--line)")+"'>★</span>";
      const card=el("div","card tapc br-card animin"); card.style.animationDelay=(0.32+i*0.06)+"s";
      card.innerHTML="<span id='invbrbadge_"+d.id+"' style='position:absolute;top:8px;left:8px;background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px'></span>"+
        "<div class='t'>"+esc(x.name)+"</div><div class='st'>"+starHtml+"</div>";
      card.onclick=()=>branchInventoryPage(c,{id:d.id,name:x.name});
      row.appendChild(card);
    });
    // شارة المعلّق لكل فرع
    if(invApprover()){
      const pend={}; const per={};
      const paint=()=>{ branchDocs.forEach(d=>{ const b=$("invbrbadge_"+d.id); if(b){ const n=pend[d.id]||0; if(n){b.textContent=n;b.style.display="flex";}else b.style.display="none"; } }); };
      const watch=(coll)=>{ cRef().collection(coll).onSnapshot(cs=>{
        const local={}; cs.forEach(dd=>{const y=dd.data(); const st=y.status; if(st!=="approved"&&st!=="rejected"&&st!=="done"){ local[y.branchId]=(local[y.branchId]||0)+1; }});
        per[coll]=local; for(const kk in pend) delete pend[kk];
        Object.values(per).forEach(m=>{ for(const bid in m) pend[bid]=(pend[bid]||0)+m[bid]; });
        paint();
      },()=>{}); };
      ["stockCounts","stockOrders","waste","expenses","dailyClosings","invoices"].forEach(watch);
    }
    if(typeof translateTree==="function") translateTree(row);
  },()=>{});

  setTimeout(()=>{ if(typeof translateTree==="function") translateTree(c); },0);
}

// جدول طلبات فرع محدّد
function renderBranchOrders(panel, br){

    rows.sort((a,b)=>((b.at&&b.at.seconds)||0)-((a.at&&a.at.seconds)||0));
    tb.innerHTML=""; if(!rows.length){ tb.innerHTML="<tr><td colspan='4' class='muted'>"+L("لا توجد طلبات")+"</td></tr>"; return; }
    rows.forEach(x=>{

      const b=el("button","btn sm status-act "+cls,lbl);

      tr.lastChild.appendChild(b); tb.appendChild(tr);
    });

}

// جدول تحويلات فرع محدّد (وارد + صادر)
function renderBranchTransfers(panel, br){
  panel.innerHTML="<div class='card'><table><thead><tr><th>"+L("التاريخ والوقت")+"</th><th>"+L("من")+" → "+L("إلى")+"</th><th>"+L("الأصناف")+"</th><th>"+L("الحالة")+"</th></tr></thead><tbody id='brTrRows'><tr><td colspan='4' class='muted'>"+L("جارٍ التحميل…")+"</td></tr></tbody></table></div>";
  const app=canApproveTransfer();
  cRef().collection("transfers").onSnapshot(s=>{
    const tb=$("brTrRows"); if(!tb) return; const rows=[]; s.forEach(d=>{ const y=d.data(); if(y.fromId===br.id||y.toId===br.id) rows.push({id:d.id,...y}); });
    rows.sort((a,b)=>((b.at&&b.at.seconds)||0)-((a.at&&a.at.seconds)||0));
    tb.innerHTML=""; if(!rows.length){ tb.innerHTML="<tr><td colspan='4' class='muted'>"+L("لا توجد تحويلات")+"</td></tr>"; return; }
    rows.forEach(x=>{
      const items=(x.items||[]).map(it=>esc(it.name)+" ×"+(it.qty||0)).join("، ");
      const arrow=esc(x.fromName||"")+" → "+esc(x.toName||"");
      const tr=el("tr",null,"<td>"+fmtDT(x.at)+"</td><td class='muted'>"+arrow+"</td><td class='muted'>"+items+"</td><td></td>");
      const status=x.status, isPending=(status!=="approved"&&status!=="rejected");
      const lbl=isPending?L("قيد المراجعة"):(status==="approved"?L("تم الاعتماد"):L("مرفوضة"));
      const cls=status==="approved"?"green":status==="rejected"?"red":"amber";
      const b=el("button","btn sm status-act "+cls,lbl);
      b.onclick=(e)=>{ e.stopPropagation();
        const items2=[{label:L("معاينة"), fn:()=>viewTransfer(x)}];
        if(app){
          if(isPending){ items2.push({label:L("اعتماد"), fn:()=>approveTransfer(x.id,x)});
            items2.push({label:L("رفض"), danger:true, fn:()=>{cRef().collection("transfers").doc(x.id).update({status:"rejected",decidedBy:state.user.uid,decidedByName:state.profile.name||state.user.email,decidedAt:now()});logAction("reject_transfer",x.fromName+" → "+x.toName);}}); }
          else if(status==="approved"){ items2.push({label:L("إلغاء الاعتماد"), danger:true, fn:()=>undoTransfer(x.id,x)}); }
        }
        openActionMenu(b, items2);
      };
      tr.lastChild.appendChild(b); tb.appendChild(tr);
    });
  },()=>{ const tb=$("brTrRows"); if(tb) tb.innerHTML="<tr><td colspan='4' style='color:var(--red)'>"+L("تعذّر التحميل — تحقّق من قواعد الأمان")+"</td></tr>"; });
}

// نافذة إضافة مخزون (توريد) — تزيد على الموجود ولا تستبدل
async function warehouseAddStockForm(c, wh){
  const snap=await cRef().collection("products").orderBy("name").get();
  if(snap.empty){ toast(L("لا توجد منتجات"),"err"); return; }
  const prods=[]; snap.forEach(d=>prods.push({id:d.id,...d.data()}));
  const stock=await branchStockMap(wh.id);
  const rows=prods.map((p,i)=>"<tr><td><b>"+esc(p.name)+"</b> <span class='muted'>"+esc(p.unit||"")+"</span><div class='muted' style='font-size:12px'>"+L("المتوفر")+": "+(stock[p.id]!=null?stock[p.id]:0)+"</div></td><td><input class='input addq' data-i='"+i+"' type='number' inputmode='decimal' style='width:100px;padding:6px' placeholder='0'></td></tr>").join("");
  openModal(L("إضافة مخزون — ")+esc(wh.name),
    "<div class='muted' style='font-size:13px;margin-bottom:8px'>"+esc(L("أدخل الكمية المُضافة لكل منتج (تُضاف فوق الموجود، لا تستبدله)."))+"</div>"+
    "<table><thead><tr><th>"+esc(L("المنتج"))+"</th><th>"+esc(L("الكمية المُضافة"))+"</th></tr></thead><tbody>"+rows+"</tbody></table>",
    "تأكيد الإضافة", async ()=>{
      const adds=[]; document.querySelectorAll("#modalRoot .addq").forEach(inp=>{ const v=parseFloat(inp.value)||0; if(v>0){ const i=+inp.dataset.i; adds.push({productId:prods[i].id,name:prods[i].name,qty:v}); } });
      if(!adds.length){ toast(L("أدخل كمية واحدة على الأقل"),"err"); return false; }
      try{
        const batch=db.batch();
        adds.forEach(a=>{ const ref=cRef().collection("branchStock").doc(bsId(wh.id,a.productId));
          batch.set(ref,{branchId:wh.id,productId:a.productId,name:a.name,qty:firebase.firestore.FieldValue.increment(a.qty),updatedAt:now()},{merge:true});
        });
        await batch.commit();
        logAction("add_stock", wh.name+" — "+adds.length+" "+L("صنف"));
        toast(L("تمت إضافة المخزون"),"ok");
        warehousePage(c, wh);
        return true;
      }catch(e){ console.error(e); toast(L("تعذّر الحفظ — تحقّق من قواعد الأمان"),"err"); return false; }
    });
}

// نافذة مراجعة طلب الفرع: المطلوب مقابل الموجود بالمستودع + اعتماد/رفض
async function reviewOrderModal(orderId, x){
  // إن كان الطلب معتمداً: افتح صفحة المعاينة (تم الطلب / تم الإرسال)
  if(x.status==="approved"){ viewApprovedOrder(x); return; }

  const whStock=await branchStockMap(wh.id);
  const items=(x.items||[]);
  // بناء صفوف الجدول: المطلوب / الموجود بالمستودع — تمييز النقص بالأحمر
  let anyShort=false; const shortList=[];
  const rowsHtml=items.map(it=>{
    const req=Number(it.qty)||0; const have=Number(whStock[it.productId]!=null?whStock[it.productId]:0);
    const short = have<req; if(short){ anyShort=true; shortList.push({name:it.name, req, have}); }
    const haveCell = short
      ? "<td style='color:var(--red);font-weight:700'>"+have+" ⚠️</td>"
      : "<td style='color:var(--green)'>"+have+"</td>";
    return "<tr class='"+(short?"ord-short":"")+"'><td><b>"+esc(it.name)+"</b></td><td style='font-weight:700'>"+req+"</td>"+haveCell+"</tr>";
  }).join("");
  let warnHtml="";
  if(anyShort){
    warnHtml="<div class='ord-warn'>"+
      "<div>⚠️ <b>"+L("بعض المنتجات غير متوفرة كاملة — سيُرسل المتوفر فقط والباقي يُسجّل صفراً:")+"</b></div>"+
      shortList.map(s=>"<div>• "+esc(s.name)+": "+L("مطلوب")+" "+s.req+"، "+L("موجود")+" "+s.have+"</div>").join("")+
    "</div>";
  }
  const canApp=canApproveOrder();
  const body=
    "<div class='review-row'><span>"+L("الطالب")+"</span><b>"+esc(x.byName||"")+"</b></div>"+
    "<div class='review-row'><span>"+L("التاريخ")+"</span><b>"+fmtDT(x.at)+"</b></div>"+
    "<div class='review-row'><span>"+L("من المستودع")+"</span><b>"+esc(wh.name)+"</b></div>"+
    "<div class='review-row'><span>"+L("إلى الفرع")+"</span><b style='color:var(--brand)'>"+esc(x.branchName||"")+"</b></div>"+
    "<table style='margin-top:12px'><thead><tr><th>"+L("المنتج")+"</th><th>"+L("المطلوب")+"</th><th>"+L("الموجود بالمستودع")+"</th></tr></thead><tbody>"+rowsHtml+"</tbody></table>"+
    warnHtml+
    "<div class='muted' style='font-size:11px;text-align:center;margin-top:10px'>"+L("المنتج الأحمر = الكمية غير كافية")+"</div>";
  const isPending=(x.status!=="approved"&&x.status!=="rejected");
  if(canApp && isPending){
    openModal(L("مراجعة طلب — ")+esc(x.branchName||""),
      body+"<div style='display:flex;gap:10px;margin-top:18px'>"+
        "<button class='btn primary' id='ordApprove' style='flex:1'>"+esc(L("اعتماد وخصم من المستودع"))+"</button>"+
        "<button class='btn danger' id='ordReject' style='flex:1'>"+esc(L("رفض"))+"</button>"+
      "</div>", null, ()=>true, true, 520);
    setTimeout(()=>{
      if($("ordApprove"))$("ordApprove").onclick=()=>{
        if(anyShort && !confirm(L("بعض المنتجات غير متوفرة كاملة. سيُرسل المتوفر فقط. متابعة؟"))) return;
        approveOrder(orderId,x,wh,whStock);
      };
      if($("ordReject"))$("ordReject").onclick=()=>{ rejectOrder(orderId,x); closeModal(); };
    },30);
  } else {
    openModal(L("مراجعة طلب — ")+esc(x.branchName||""), body, "تم", ()=>true, true, 520);
  }
}

// اعتماد الطلب: خصم ذكي — يُخصم المتوفر فقط (لا يصير سالب)، ويُسجّل «تم الإرسال» لكل منتج
async function approveOrder(orderId, x, wh, whStock){
  try{
    if(!whStock) whStock=await branchStockMap(wh.id);
    const sent=[]; // {productId,name,requested,sent}
    const batch=db.batch();
    (x.items||[]).forEach(it=>{
      const req=Number(it.qty)||0;
      const have=Number(whStock[it.productId]!=null?whStock[it.productId]:0);
      const send=Math.max(0, Math.min(req, have)); // المتوفر فقط، لا سالب
      sent.push({productId:it.productId, name:it.name, requested:req, sent:send});
      if(send>0){
        // خصم من المستودع الرئيسي
        const whRef=cRef().collection("branchStock").doc(bsId(wh.id,it.productId));
        batch.set(whRef,{branchId:wh.id,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(-send),updatedAt:now()},{merge:true});
        // إضافة للفرع الطالب (نقل الكمية فوراً)
        if(x.branchId){ const brRef=cRef().collection("branchStock").doc(bsId(x.branchId,it.productId));
          batch.set(brRef,{branchId:x.branchId,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(send),updatedAt:now()},{merge:true}); }
      }
    });
    batch.update(cRef().collection("stockOrders").doc(orderId),{
      status:"approved", approvedBy:state.user.uid, approvedByName:state.profile.name||state.user.email, approvedAt:now(),
      warehouseId:wh.id, warehouseName:wh.name, sent
    });
    await batch.commit();
    logAction("approve_order",(x.branchName||"")+" — "+L("نقل من ")+wh.name);
    toast(L("تم اعتماد الطلب ونقل الكمية للفرع"),"ok");
    closeModal();
  }catch(e){ console.error(e); toast(L("تعذّر الحفظ — تحقّق من قواعد الأمان"),"err"); }
}
function rejectOrder(orderId, x){
  cRef().collection("stockOrders").doc(orderId).update({status:"rejected",approvedBy:state.user.uid,approvedByName:state.profile.name||state.user.email,approvedAt:now()});
  logAction("reject_order",x.branchName||"");
  toast(L("تم رفض الطلب"),"ok");
}

    "<div class='review-row'><span>"+L("المستقبِل")+"</span><b>"+esc(x.branchName||"")+"</b></div>"+
    "<div class='review-row'><span>"+L("من")+" → "+L("إلى")+"</span><b>"+esc(x.warehouseName||L("المستودع الرئيسي"))+" → "+esc(x.branchName||"")+"</b></div>"+
    "<table style='margin-top:12px'><thead><tr><th>"+L("المنتج")+"</th><th>"+L("تم الطلب")+"</th><th>"+L("تم الإرسال")+"</th></tr></thead><tbody>"+rowsHtml+"</tbody></table>"+
    "<div class='muted' style='font-size:11px;text-align:center;margin-top:10px'>"+L("الأحمر = غير متوفر (0) · الأصفر = أُرسل جزئياً")+"</div>",
    "تم", ()=>true, true, 520);
}
