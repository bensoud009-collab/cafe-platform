// حساب الاستهلاك النظري: مبيعات × مكوّنات الوصفات، مجمّعة لكل منتج
function computeConsumption(lines, recipes){
  const byProd={}; // productId -> {name,unit,qty}
  lines.forEach(l=>{ const r=recipes.find(rr=>rr.id===l.recipeId); if(!r) return;
    (r.ingredients||[]).forEach(ing=>{ const add=(Number(ing.qty)||0)*(Number(l.qty)||0);
      if(!byProd[ing.productId]) byProd[ing.productId]={productId:ing.productId,name:ing.name,unit:ing.unit,qty:0};
      byProd[ing.productId].qty+=add;
    });
  });
  return Object.values(byProd);
}

// هل يوجد جرد معتمد أحدث لنفس الفرع؟ (يمنع التراجع غير الآمن)
async function newerApprovedCount(branchId, at, exceptId){
  try{ const s=await cRef().collection("stockCounts").where("branchId","==",branchId).where("status","==","approved").get();
    let f=false; s.forEach(d=>{ if(d.id===exceptId)return; const y=d.data(); if(y.at&&at&&y.at.seconds>at.seconds) f=true; }); return f;
  }catch(e){ return false; }
}
async function setCountStatus(id,x,newStatus){
  if(x.status===newStatus) return;
  const bid=x.branchId;
  if(newStatus==="approved"){
    if(await newerApprovedCount(bid,x.at,id)){ toast("لا يمكن الاعتماد — يوجد جرد أحدث معتمد لهذا الفرع. سجّل جرداً جديداً بدلاً من ذلك.","err"); return; }
    return approveCount(id,x);
  }
  // مغادرة الاعتماد (approved → rejected): إرجاع الكميات لما قبل هذا الجرد
  if(x.status==="approved"){
    if(await newerApprovedCount(bid,x.at,id)){ toast("لا يمكن التراجع — يوجد جرد أحدث معتمد لهذا الفرع. سجّل جرداً جديداً للتصحيح.","err"); return; }
    for(const r of (x.results||[])){ if(r.productId!=null){ try{ await cRef().collection("branchStock").doc(bsId(bid,r.productId)).set({branchId:bid,productId:r.productId,name:r.name,qty:Number(r.systemQty)||0,updatedAt:now()},{merge:true}); }catch(e){} } }
  }
  await cRef().collection("stockCounts").doc(id).update({status:newStatus,approvedBy:state.user.uid,approvedAt:now()});
  logAction(newStatus==="rejected"?"reject_count":"update_count",(x.branchName||""));
  toast(newStatus==="rejected"?"تم رفض الجرد وإرجاع الكميات":"تم التحديث","ok");
}

    }; });

async function approveWaste(id,x,note){
  try{ const ref=cRef().collection("branchStock").doc(bsId(x.branchId,x.productId)); const pd=await ref.get(); const cur=pd.exists?(Number(pd.data().qty)||0):0; await ref.set({branchId:x.branchId,productId:x.productId,name:x.name,qty:Math.max(0,cur-(Number(x.qty)||0)),updatedAt:now()},{merge:true}); }catch(e){}
  await cRef().collection("waste").doc(id).update({status:"approved",note:note||"",approvedBy:state.user.uid,approvedAt:now()});
  logAction("approve_waste",x.name+" ×"+x.qty+" — "+(x.branchName||"")); toast("تم اعتماد التالف وخصمه من الفرع","ok");
}
// يوجد جرد معتمد أحدث لنفس الفرع بعد هذا التالف؟ (يجعل التراجع غير دقيق)
async function newerCountAfterWaste(branchId, at){
  try{ const s=await cRef().collection("stockCounts").where("branchId","==",branchId).where("status","==","approved").get();
    let f=false; s.forEach(d=>{const y=d.data(); if(y.at&&at&&y.at.seconds>at.seconds) f=true;}); return f;
  }catch(e){ return false; }
}
async function setWasteStatus(id,x,newStatus){
  if(x.status===newStatus) return;
  if(newStatus==="approved"){ return approveWaste(id,x,x.note||""); }
  // مغادرة الاعتماد: إرجاع الكمية للمخزون (بشرط عدم وجود جرد أحدث)
  if(x.status==="approved"){
    if(await newerCountAfterWaste(x.branchId,x.at)){ toast("لا يمكن التراجع — يوجد جرد أحدث معتمد لهذا الفرع. سجّل جرداً جديداً للتصحيح.","err"); return; }
    try{ const ref=cRef().collection("branchStock").doc(bsId(x.branchId,x.productId)); const pd=await ref.get(); const cur=pd.exists?(Number(pd.data().qty)||0):0; await ref.set({branchId:x.branchId,productId:x.productId,name:x.name,qty:cur+(Number(x.qty)||0),updatedAt:now()},{merge:true}); }catch(e){}
  }
  await cRef().collection("waste").doc(id).update({status:newStatus,approvedBy:state.user.uid,approvedAt:now()});
  logAction(newStatus==="rejected"?"reject_waste":"update_waste",x.name+" — "+(x.branchName||""));
  toast(newStatus==="rejected"?"تم رفض التالف وإرجاع الكمية":"تم التحديث","ok");
}

function waLink(phone){ let p=(phone||"").replace(/[^0-9]/g,""); if(p.startsWith("00"))p=p.slice(2); if(p.startsWith("0"))p="966"+p.slice(1); if(p.length===9)p="966"+p; return "https://wa.me/"+p; }
function normUrl(u){ u=(u||"").trim(); if(u&&!/^https?:\/\//i.test(u))u="https://"+u; return u; }

async function renderSupplierDetail(c,id){
  const doc=await cRef().collection("suppliers").doc(id).get();
  if(!doc.exists){ toast("المورد غير موجود","err"); return openPage("suppliers"); }
  const x=doc.data();
  c.innerHTML="";
  const back=el("button","btn sm","← رجوع للموردين"); back.style.marginBottom="14px"; back.onclick=()=>openPage("suppliers"); c.appendChild(back);
  // بطاقة بيانات المورد
  const head=el("div","card"); head.style.marginBottom="16px";
  let contact="";
  if(x.phone) contact+="<a class='btn sm' style='background:#25D366;color:#fff;border:none' href='"+waLink(x.phone)+"' target='_blank'>واتساب</a> <a class='btn sm' href='tel:"+esc(x.phone)+"'>اتصال</a> ";
  if(x.url) contact+="<a class='btn sm' href='"+esc(normUrl(x.url))+"' target='_blank'>🔗 الموقع</a>";
  head.innerHTML="<div style='display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap'>"+
    "<div><h2 style='font-size:22px'>"+esc(x.company)+"</h2>"+
    "<div class='muted' style='margin-top:4px'>المندوب: "+esc(x.rep||"—")+(x.phone?" · "+esc(x.phone):"")+"</div></div>"+
    "<div style='display:flex;gap:6px;flex-wrap:wrap'>"+contact+"</div></div>";
  const actions=el("div"); actions.style.marginTop="12px";
  if(can("suppliers","edit")){ const e=el("button","btn sm","تعديل بيانات المورد"); e.onclick=()=>supplierModal(id,x); actions.appendChild(e); }
  if(can("suppliers","delete")){ const dl=el("button","btn sm danger","حذف المورد"); dl.style.marginRight="6px"; dl.onclick=()=>{if(confirm("حذف المورد؟")){cRef().collection("suppliers").doc(id).delete();logAction("delete_supplier",x.company);openPage("suppliers");}}; actions.appendChild(dl); }
  head.appendChild(actions);
  c.appendChild(head);

  // منتجات المورد
  const pbar=el("div"); pbar.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px";
  pbar.innerHTML="<h3>المنتجات والأسعار</h3>";
  if(can("suppliers","edit")){ const add=el("button","btn primary sm","+ منتج"); add.onclick=()=>productPriceModal(id,x,null); pbar.appendChild(add); }
  c.appendChild(pbar);

  const list=el("div","card");
  const prods=x.products||[];
  if(!prods.length){ list.innerHTML="<p class='muted'>لا توجد منتجات. أضف منتجاً لتتبّع سعره.</p>"; }
  else{
    let html="<table><thead><tr><th>المنتج</th><th>السعر الحالي</th><th>أعلى</th><th>أقل</th><th>التغيّر</th><th>إجراء</th></tr></thead><tbody>";
    prods.forEach((p,i)=>{
      const hist=p.history||[]; const prices=hist.map(h=>Number(h.price));
      const high=prices.length?Math.max(...prices):Number(p.price)||0;
      const low=prices.length?Math.min(...prices):Number(p.price)||0;
      let change="—",col="var(--muted)";
      if(hist.length>=2){ const cur=Number(hist[hist.length-1].price), prev=Number(hist[hist.length-2].price);
        if(prev>0){ const pct=((cur-prev)/prev)*100; const up=pct>=0; change=(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"%"; col=up?"var(--red)":"var(--green)"; } }
      html+="<tr><td><b>"+esc(p.name)+"</b></td><td>"+money(p.price)+"</td><td class='muted'>"+money(high)+"</td><td class='muted'>"+money(low)+"</td>"+
        "<td style='color:"+col+"'>"+change+"</td><td><button class='btn sm' data-up='"+i+"'>تحديث السعر</button></td></tr>";
    });
    html+="</tbody></table>"; list.innerHTML=html;
  }
  c.appendChild(list);
  list.querySelectorAll("[data-up]").forEach(b=>{ b.onclick=()=>productPriceModal(id,x,parseInt(b.dataset.up)); });
}

// إضافة منتج جديد أو تحديث سعر منتج قائم (يُسجّل في السجل تلقائياً)
function productPriceModal(supId,supData,index){
  const isNew = index===null || index===undefined;
  const prod = isNew?null:(supData.products||[])[index];
  openModal(isNew?"إضافة منتج":"تحديث سعر: "+esc(prod?prod.name:""),
    (isNew?"<label class='field'><span>اسم المنتج *</span><input id='ppName' class='input'></label>":"")+
    "<label class='field'><span>"+(isNew?"السعر الحالي *":"السعر الجديد *")+"</span><input id='ppPrice' class='input' type='number' inputmode='decimal'></label>"+
    (isNew?"":"<p class='muted' style='font-size:13px'>يُضاف السعر للسجل ويُعاد حساب أعلى/أقل ونسبة التغيّر تلقائياً.</p>"),
    "حفظ", async ()=>{
      const price=parseFloat($("ppPrice").value);
      if(isNaN(price)||price<=0){toast("أدخل سعراً صحيحاً","err");return false;}
      const today=new Date().toISOString().slice(0,10);
      const ref=cRef().collection("suppliers").doc(supId);
      const fresh=(await ref.get()).data(); const products=fresh.products||[];
      if(isNew){
        const name=$("ppName").value.trim(); if(!name){toast("أدخل اسم المنتج","err");return false;}
        products.push({name,price,history:[{price,date:today}]});
        logAction("add_supplier_product",supData.company+" / "+name);
      }else{
        const p=products[index]; p.price=price; p.history=(p.history||[]); p.history.push({price,date:today});
        logAction("update_price",supData.company+" / "+p.name+" = "+price);
      }
      await ref.update({products});
      const c=$("pageContent"); renderSupplierDetail(c,supId);
      return true;
    });
}

async function approveTransfer(id,x){
  try{
    const batch=db.batch();
    (x.items||[]).forEach(it=>{
      const q=Number(it.qty)||0;
      const fromRef=cRef().collection("branchStock").doc(bsId(x.fromId,it.productId));
      const toRef=cRef().collection("branchStock").doc(bsId(x.toId,it.productId));
      batch.set(fromRef,{branchId:x.fromId,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(-q),updatedAt:now()},{merge:true});
      batch.set(toRef,{branchId:x.toId,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(q),updatedAt:now()},{merge:true});
    });
    batch.update(cRef().collection("transfers").doc(id),{status:"approved",decidedBy:state.user.uid,decidedByName:state.profile.name||state.user.email,decidedAt:now()});
    await batch.commit();
    logAction("approve_transfer",x.fromName+" → "+x.toName);
    toast("تم اعتماد التحويل وتحريك الكميات","ok");
  }catch(e){ console.error(e); toast("تعذّر الاعتماد","err"); }
}
async function undoTransfer(id,x){
  if(!confirm(L("إلغاء اعتماد التحويل وإرجاع الكميات؟"))) return;
  try{
    const batch=db.batch();
    (x.items||[]).forEach(it=>{
      const q=Number(it.qty)||0;
      const fromRef=cRef().collection("branchStock").doc(bsId(x.fromId,it.productId));
      const toRef=cRef().collection("branchStock").doc(bsId(x.toId,it.productId));
      batch.set(fromRef,{branchId:x.fromId,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(q),updatedAt:now()},{merge:true});
      batch.set(toRef,{branchId:x.toId,productId:it.productId,name:it.name,qty:firebase.firestore.FieldValue.increment(-q),updatedAt:now()},{merge:true});
    });
    batch.update(cRef().collection("transfers").doc(id),{status:"pending",decidedBy:firebase.firestore.FieldValue.delete(),decidedByName:firebase.firestore.FieldValue.delete(),decidedAt:firebase.firestore.FieldValue.delete()});
    await batch.commit();
    logAction("undo_transfer",x.fromName+" → "+x.toName);
    toast("أُلغي الاعتماد وأُرجعت الكميات","ok");
  }catch(e){ console.error(e); toast("تعذّر الإلغاء","err"); }
}

async function branchDetail(c,id,x){
  const isWh=!!x.isWarehouse;
  const fromInv=(state.current==="inventory");
  c.classList.remove("inv-hub"); c.innerHTML=""; const back=el("button","btn sm",fromInv?"← رجوع للمخزون":"← رجوع للفروع"); back.style.marginBottom="14px"; back.onclick=()=>{ if(fromInv) inventoryHub(c); else openPage("branches"); }; c.appendChild(back);
  const head=el("div","card"); head.style.marginBottom="16px";
  head.innerHTML="<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'><h2 style='font-size:22px'>"+(isWh?"🏬 ":"")+esc(x.name)+(isWh?" <span class='muted' style='font-size:14px'>("+L("مستودع")+")</span>":"")+"</h2><div></div></div>";
  const hb=head.querySelector("div>div:last-child");
  if(can("branches","edit")){const e=el("button","btn sm","تعديل");e.onclick=()=>isWh?warehouseModal(id,x):branchModal(id,x);hb.appendChild(e);}
  if(can("branches","delete")){const dl=el("button","btn sm danger","حذف");dl.style.marginRight="6px";dl.onclick=()=>{if(confirm(isWh?L("حذف المستودع؟"):"حذف الفرع؟")){cRef().collection("branches").doc(id).delete();logAction(isWh?"delete_warehouse":"delete_branch",x.name);openPage("branches");}};hb.appendChild(dl);}
  c.appendChild(head);
  // للفرع فقط: بطاقات المبيعات/الموظفين/التقييم
  if(!isWh){
    const grid=el("div","kpi-grid"); grid.style.marginBottom="16px";
    grid.innerHTML=kpi("مبيعات الفرع (الشهر)","brSales","—")+kpi("عدد الموظفين","brEmps","—")+
      "<div class='kpi' id='brEvalCard' style='cursor:pointer'><div class='l'>تقييم الفرع</div><div class='v' id='brEvalAvg'>—</div><div class='muted' style='font-size:12px'>اضغط للتقييم</div></div>";
    c.appendChild(grid);
    $("brEvalCard").onclick=()=>branchEvalPage(c,id,x);
  }
  // بطاقات المخزون لكل موقع (جرد/طلب/تالف/مصروفات) — للمالك/المدير
  if(invApprover()){
    const br={id:id,name:x.name};
    const backFn=()=>branchDetail(c,id,x);
    const invGrid=el("div"); invGrid.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:16px";
    const mk=(key,title,desc)=>{ const card=el("div","card"); card.style.cssText="cursor:pointer;min-height:110px;position:relative";
      card.innerHTML="<div style='font-weight:800'>"+title+"</div><div class='muted' style='font-size:13px;margin-top:4px'>"+desc+"</div><span id='bbadge_"+key+"' style='position:absolute;top:10px;left:10px;background:var(--red);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px'></span>";
      card.onclick=()=>{ const f={count:invCount,order:invOrders,waste:invWaste,expenses:pageExpenses}[key]; f(c,br,backFn); setTimeout(()=>{ if(typeof translateTree==="function") translateTree(c); },60); };
      invGrid.appendChild(card);
    };
    mk("count","الجرد",isWh?L("جرد كميات المستودع"):"جرد كميات هذا الفرع");
    mk("order","الطلب",isWh?L("طلبات المستودع"):"طلبات هذا الفرع");
    mk("waste","تالف",isWh?L("توالف المستودع"):"توالف هذا الفرع");
    if(!isWh) mk("expenses","المصروفات","مصروفات هذا الفرع");
    c.appendChild(invGrid);
    // شارات المعلّق لهذا الموقع
    const setBB=(coll,key)=>{ cRef().collection(coll).where("branchId","==",id).onSnapshot(s=>{ let n=0; s.forEach(d=>{const st=d.data().status; if(st!=="approved"&&st!=="rejected"&&st!=="done")n++;}); const b=$("bbadge_"+key); if(b){ if(n){b.textContent=n;b.style.display="flex";}else b.style.display="none"; } },()=>{}); };
    setBB("stockCounts","count"); setBB("stockOrders","order"); setBB("waste","waste"); if(!isWh) setBB("expenses","expenses");
  }
  if(isWh) return; // المستودع ما له مبيعات/تقييم
  // مبيعات الفرع للشهر
  const cur=monthRange(0);
  cRef().collection("dailyClosings").where("date",">=",cur.start).where("date","<",cur.next).onSnapshot(s=>{
    let sum=0;s.forEach(d=>{const y=d.data();if(y.branchId===id && y.status==="approved")sum+=Number(y.actualSales)||0;});
    if($("brSales"))$("brSales").textContent=money(sum);
  },()=>{});

async function submitBranchEval(id,x,crit){
  const vals=window.__brEval||{};
  for(let i=0;i<crit.length;i++){if(vals[i]===undefined){toast("حدّد إيه/لا لكل المعايير","err");return false;}}
  const notes={},files={};
  document.querySelectorAll("#modalRoot .bnote").forEach(n=>notes[n.dataset.i]=n.value.trim());
  document.querySelectorAll("#modalRoot .bphoto").forEach(p=>{if(p.files[0])files[p.dataset.i]=p.files[0];});
  try{
    const ref=cRef().collection("branchEvals").doc();
    const results=[];
    for(let i=0;i<crit.length;i++){let photoUrl="";
      if(files[i]){const path="companies/"+state.companyId+"/branchEval/"+ref.id+"_"+i+".jpg";photoUrl=await tryUploadImage(path,files[i]);}
      results.push({name:crit[i],ok:!!vals[i],note:notes[i]||"",photoUrl});
    }
    const yes=results.filter(r=>r.ok).length; const pct=Math.round(yes/results.length*100);
    await ref.set({branchId:id,branchName:x.name,date:todayStr(),byName:state.profile.name||state.user.email,results,pct,at:now()});
    logAction("add_branch_eval",x.name+" "+pct+"%");
    toast("تم حفظ التقييم","ok"); return true;
  }catch(e){console.error(e);toast("تعذّر الحفظ","err");return false;}
}

function workDuration(start){
  if(!start) return "—"; const s=new Date(start), n=new Date(); if(isNaN(s)) return "—";
  let months=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());
  if(n.getDate()<s.getDate()) months--; if(months<0) return "—";
  const y=Math.floor(months/12), m=months%12;
  return (y?y+L(" سنة "):"")+(m?m+L(" شهر"):(y?"":L("أقل من شهر")));
}

function createEmployeeAccount(empId,x){
  openModal(L("إنشاء حساب: ")+esc(x.name),
    "<label class='field'><span>البريد الإلكتروني *</span><input id='caEmail' class='input' type='email' placeholder='name@example.com'></label>"+
    "<label class='field'><span>الدور *</span><select id='caRole'><option value='employee'>موظف</option><option value='manager'>مدير فرع</option></select></label>"+
    "<p class='muted' style='font-size:13px'>تُولّد كلمة مرور عشوائية تلقائياً.</p>",
    "إنشاء الحساب", async ()=>{
      const email=$("caEmail").value.trim().toLowerCase(), role=$("caRole").value;
      if(!email){toast("أدخل البريد","err");return false;}
      const pass=randomPassword();
      try{
        const cred=await secondaryAuth.createUserWithEmailAndPassword(email,pass);
        const uid=cred.user.uid; await secondaryAuth.signOut();
        await db.collection("users").doc(uid).set({role,companyId:state.companyId,name:x.name,createdAt:now()});
        const perms=emptyPermissions();
        if(role==="manager"){["dashboard","sales","inventory","checklist","reports"].forEach(k=>{if(perms[k])perms[k].view=true;});perms.sales.add=true;perms.sales.approve=true;}
        else{perms.dashboard.view=true;perms.sales.view=true;perms.sales.add=true;perms.checklist.view=true;}
        await cRef().collection("users").doc(uid).set({name:x.name,email,role,permissions:perms,employeeId:empId,branchId:x.branchId||"",branchName:x.branchName||"",isWarehouseKeeper:!!x.isWarehouseKeeper,createdAt:now()});
        await cRef().collection("employees").doc(empId).update({hasAccount:true,uid,email,role});
        logAction("add_user",x.name+" ("+role+")");
        closeModal();
        openModal("تم إنشاء الحساب ✅",
          "<div class='review-row'><span>الموظف</span><b>"+esc(x.name)+"</b></div>"+
          "<div class='review-row'><span>البريد</span><b>"+esc(email)+"</b></div>"+
          "<div class='review-row'><span>كلمة المرور</span><b>"+esc(pass)+"</b></div>"+
          "<p class='muted' style='margin-top:12px;font-size:13px'>سلّمها للموظف. لن تُحفظ — استخدم «كلمة مرور جديدة» لاحقاً عند الحاجة.</p>",
          "تم",()=>true,true);
        return false;
      }catch(e){toast(e.code==="auth/email-already-in-use"?"البريد مستخدم":"تعذّر الإنشاء","err");return false;}
    });
}

function monthKey(offset){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+(offset||0)); return d.toISOString().slice(0,7); }
function staffPayroll(c){
  c.innerHTML=""; c.appendChild(staffBack(c));
  c.appendChild(el("div",null,pageTitle("الرواتب","كشف شهري — الصافي يُحسب تلقائياً")));
  // اختيار الشهر
  const months=[]; for(let i=0;i<12;i++) months.push(monthKey(-i));
  const sel=el("div"); sel.style.marginBottom="16px";
  sel.innerHTML="<label class='field' style='max-width:220px'><span>الشهر</span><select id='payMonth'>"+months.map(m=>"<option value='"+m+"'>"+m+"</option>").join("")+"</select></label>";
  c.appendChild(sel);
  c.appendChild(el("div","kpi-grid",kpi("إجمالي رواتب الشهر (صافي)","payTotal","—")));
  const wrap=el("div"); wrap.id="payWrap"; wrap.style.marginTop="16px"; c.appendChild(wrap);
  $("payMonth").onchange=()=>loadPayroll($("payMonth").value);
  loadPayroll(months[0]);
}
async function loadPayroll(month){
  const wrap=$("payWrap"); if(!wrap) return; wrap.innerHTML="<div class='card muted'>جارٍ التحميل…</div>";
  const [empSnap,paySnap]=await Promise.all([cRef().collection("employees").orderBy("name").get(),cRef().collection("payroll").doc(month).get()]);
  const saved=(paySnap.exists&&paySnap.data().rows)||[];
  const byId={}; saved.forEach(r=>byId[r.empId]=r);
  const rows=[]; empSnap.forEach(d=>{const x=d.data(); const s=byId[d.id]||{};
    rows.push({empId:d.id,uid:x.uid||null,name:x.name,salary:Number(x.salary)||0,
      overtime:s.overtime||0,bonus:s.bonus||0,deductions:s.deductions||0,advance:s.advance||0});
  });
  const card=el("div","card");
  card.innerHTML="<table><thead><tr><th>الموظف</th><th>الأساسي</th><th>أوفر تايم</th><th>مكافآت</th><th>خصومات</th><th>سلفة</th><th>الصافي</th></tr></thead><tbody id='payRows'></tbody></table>"+
    (can("staff","edit")?"<div style='margin-top:14px'><button class='btn primary' id='savePay'>حفظ كشف "+month+"</button></div>":"");
  wrap.innerHTML=""; wrap.appendChild(card);
  const tb=$("payRows");
  const calc=()=>{ let total=0; rows.forEach((r,i)=>{ const net=r.salary+num("ot"+i)+num("bn"+i)-num("dd"+i)-num("ad"+i);
      const cell=$("net"+i); if(cell)cell.textContent=money(net); total+=net; });
    if($("payTotal"))$("payTotal").textContent=money(total); };
  const num=idp=>{const el=$(idp);return el?(parseFloat(el.value)||0):0;};
  const ed=can("staff","edit");
  rows.forEach((r,i)=>{
    const inp=(idp,val)=>ed?"<input id='"+idp+i+"' class='input' type='number' style='width:80px;padding:6px' value='"+(val||0)+"'>":money(val);
    const tr=el("tr",null,"<td><b>"+esc(r.name)+"</b></td><td>"+money(r.salary)+"</td><td>"+inp("ot",r.overtime)+"</td><td>"+inp("bn",r.bonus)+"</td><td>"+inp("dd",r.deductions)+"</td><td>"+inp("ad",r.advance)+"</td><td><b id='net"+i+"'>—</b></td>");
    tb.appendChild(tr);
  });
  if(ed) ["ot","bn","dd","ad"].forEach(p=>rows.forEach((_,i)=>{const el=$(p+i);if(el)el.oninput=calc;}));
  calc();
  if($("savePay"))$("savePay").onclick=async()=>{
    const out=rows.map((r,i)=>({empId:r.empId,uid:r.uid||null,name:r.name,salary:r.salary,overtime:num("ot"+i),bonus:num("bn"+i),deductions:num("dd"+i),advance:num("ad"+i),
      net:r.salary+num("ot"+i)+num("bn"+i)-num("dd"+i)-num("ad"+i)}));
    const total=out.reduce((a,b)=>a+b.net,0);
    await cRef().collection("payroll").doc(month).set({month,rows:out,total,updatedAt:now()});
    // نسخة راتب خاصة لكل موظف له حساب (يقرأها هو فقط)
    for(const r of out){ if(r.uid){ try{ await cRef().collection("mySalary").doc(r.uid).set({
      month,salary:r.salary,overtime:r.overtime,bonus:r.bonus,deductions:r.deductions,advance:r.advance,net:r.net,updatedAt:now()}); }catch(e){} } }
    logAction("save_payroll",month); toast("تم حفظ كشف "+month,"ok");
  };
}

const EVAL_CRITERIA=["الحضور والانضباط","النظافة","التعامل مع العملاء","جودة العمل","السرعة"];
function evalLevel(pct){ return pct>=80?{t:"ممتاز",c:"green"}:pct>=60?{t:"جيد",c:"amber"}:{t:"يحتاج تطوير",c:"red"}; }
function staffEvaluation(c){
  c.innerHTML=""; c.appendChild(staffBack(c));
  c.appendChild(el("div",null,pageTitle("التقييم اليومي","قيّم أداء الموظفين بسرعة")));
  const bar=el("div"); bar.style.marginBottom="16px";
  bar.innerHTML="<button class='btn primary' id='newEvalBtn'>+ تقييم موظف</button>";
  c.appendChild(bar); $("newEvalBtn").onclick=()=>evaluationModal();
  const card=el("div","card");
  card.innerHTML="<table><thead><tr><th>التاريخ</th><th>الموظف</th><th>النسبة</th><th>المستوى</th><th>المُقيِّم</th></tr></thead><tbody id='evRows'><tr><td colspan='5' class='muted'>جارٍ التحميل…</td></tr></tbody></table>";
  c.appendChild(card);
  cRef().collection("evaluations").orderBy("at","desc").limit(100).onSnapshot(s=>{
    const tb=$("evRows");if(!tb)return;tb.innerHTML="";
    if(s.empty){tb.innerHTML="<tr><td colspan='5' class='muted'>لا توجد تقييمات</td></tr>";return;}
    s.forEach(d=>{const x=d.data();const lv=evalLevel(x.pct||0);
      tb.appendChild(el("tr",null,"<td>"+esc(x.date)+"</td><td><b>"+esc(x.name)+"</b></td><td>"+(x.pct||0)+"%</td><td><span class='tag "+lv.c+"'>"+lv.t+"</span></td><td class='muted'>"+esc(x.evaluatorName||"")+"</td>"));
    });
  },()=>{const tb=$("evRows");if(tb)tb.innerHTML="<tr><td colspan='5' style='color:var(--red)'>تعذّر التحميل</td></tr>";});
}
async function evaluationModal(){
  let emps=[];try{const s=await cRef().collection("employees").orderBy("name").get();s.forEach(d=>emps.push({id:d.id,...d.data()}));}catch(e){}
  if(!emps.length){toast("أضف موظفين أولاً","err");return;}
  const opts=emps.map(e=>"<option value='"+e.id+"'>"+esc(e.name)+"</option>").join("");
  const crit=EVAL_CRITERIA.map((cr,i)=>
    "<div class='review-row'><span>"+esc(cr)+"</span><span id='star"+i+"'></span></div>").join("");
  openModal("تقييم موظف",
    "<label class='field'><span>الموظف *</span><select id='evEmp'>"+opts+"</select></label>"+
    "<div class='muted' style='font-size:13px;margin-bottom:8px'>اختر التقييم لكل معيار (0–5):</div>"+crit,
    "حفظ التقييم", async ()=>{
      const scores=EVAL_CRITERIA.map((_,i)=>window.__ev&&window.__ev[i]||0);
      const sum=scores.reduce((a,b)=>a+b,0); const max=EVAL_CRITERIA.length*5;
      const pct=Math.round(sum/max*100);
      const sel=$("evEmp"); const emp=emps.find(e=>e.id===sel.value);
      await cRef().collection("evaluations").add({empId:sel.value,name:emp?emp.name:"",date:new Date().toISOString().slice(0,10),
        scores,sum,pct,evaluatorName:state.profile.name||state.user.email,at:now()});
      logAction("add_evaluation",(emp?emp.name:"")+" "+pct+"%");
      toast("تم حفظ التقييم","ok"); return true;
    });
  window.__ev={};
  setTimeout(()=>{ EVAL_CRITERIA.forEach((_,i)=>{ renderStars(i); }); },30);
}
function renderStars(i){
  const wrap=$("star"+i); if(!wrap) return; wrap.innerHTML="";
  for(let s=1;s<=5;s++){ const b=el("span",null,"☆"); b.style.cssText="cursor:pointer;font-size:22px;color:var(--brand)";
    b.onclick=()=>{ window.__ev[i]=s; for(let j=1;j<=5;j++){ wrap.children[j-1].textContent=j<=s?"★":"☆"; } };
    wrap.appendChild(b);
  }
}

  let head="<tr><th>القسم</th>"+ACTIONS.map(a=>"<th>"+a.name+"</th>").join("")+"</tr>";

  c.appendChild(card);
  let q=cRef().collection("checklistRuns").where("checklistId","==",id);
  q.onSnapshot(s=>{
    const tb=$("runRows");if(!tb)return;tb.innerHTML="";
    const runs=[]; s.forEach(d=>runs.push({id:d.id,...d.data()}));
    runs.sort((a,b)=>((b.at&&b.at.seconds)||0)-((a.at&&a.at.seconds)||0));
    if(!runs.length){tb.innerHTML="<tr><td colspan='5' class='muted'>لا يوجد تنفيذ بعد</td></tr>";return;}
    runs.forEach(r=>{

      tb.appendChild(tr);
    });
  },()=>{const tb=$("runRows");if(tb)tb.innerHTML="<tr><td colspan='5' style='color:var(--red)'>تعذّر التحميل</td></tr>";});
}

function manageTasksModal(id,x){
  const render=(tasks)=> tasks.length? tasks.map((t,i)=>"<div class='review-row'><span>"+(i+1)+". "+esc(t.text)+"</span><button class='btn sm danger' data-del='"+i+"'>حذف</button></div>").join("") : "<p class='muted'>لا مهام بعد</p>";
  openModal(L("إدارة مهام: ")+esc(x.name),
    "<div style='display:flex;gap:8px;margin-bottom:12px'><input id='taskText' class='input' placeholder='نص المهمة'><button type='button' class='btn' id='addTask'>إضافة</button></div>"+
    "<div id='taskList'></div>", null, ()=>true, true);
  setTimeout(()=>{ let tasks=(x.tasks||[]).slice();
    const paint=()=>{ const w=$("taskList"); if(!w)return; w.innerHTML=render(tasks);
      w.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ tasks.splice(parseInt(b.dataset.del),1); await cRef().collection("checklists").doc(id).update({tasks}); paint(); }); };
    paint();
    if($("addTask"))$("addTask").onclick=async()=>{ const v=$("taskText").value.trim(); if(!v)return; tasks.push({id:"t"+Date.now(),text:v}); await cRef().collection("checklists").doc(id).update({tasks}); $("taskText").value=""; logAction("add_task",x.name+": "+v); paint(); };
  },30);
}

// تنفيذ القائمة (الموظف/المدير/المالك) — يومي
function runChecklistModal(id,x){
  const tasks=x.tasks||[];
  if(!tasks.length){toast("لا توجد مهام في هذه القائمة","err");return;}
  const body=tasks.map((t,i)=>
    "<div class='card' style='margin-bottom:10px;padding:12px'>"+
      "<div style='font-weight:600;margin-bottom:8px'>"+(i+1)+". "+esc(t.text)+"</div>"+
      "<div style='display:flex;gap:8px;margin-bottom:8px'>"+
        "<button type='button' class='btn sm okbtn' data-i='"+i+"' data-v='1'>✓ صح</button>"+
        "<button type='button' class='btn sm nobtn' data-i='"+i+"' data-v='0'>✗ خطأ</button></div>"+
      "<input class='input note' data-i='"+i+"' placeholder='ملاحظة (اختياري)' style='margin-bottom:8px'>"+
      "<input class='input photo' data-i='"+i+"' type='file' accept='image/*' capture='environment'>"+
    "</div>").join("");
  openModal("تنفيذ: "+esc(x.name),
    "<div class='muted' style='font-size:13px;margin-bottom:10px'>حدّد لكل مهمة صح/خطأ، مع ملاحظة أو صورة إن رغبت.</div>"+body,
    "حفظ التنفيذ", ()=>submitRun(id,x,tasks));
  window.__runVals={};
  setTimeout(()=>{ document.querySelectorAll("#modalRoot .okbtn,#modalRoot .nobtn").forEach(b=>{
    b.onclick=()=>{ const i=b.dataset.i; window.__runVals[i]=b.dataset.v==="1";
      document.querySelectorAll("#modalRoot [data-i='"+i+"'].okbtn,#modalRoot [data-i='"+i+"'].nobtn").forEach(x2=>x2.style.opacity="0.4");
      b.style.opacity="1"; }; }); },30);
}
async function submitRun(id,x,tasks){
  const vals=window.__runVals||{};
  for(let i=0;i<tasks.length;i++){ if(vals[i]===undefined){toast("حدّد صح/خطأ لكل المهام","err");return false;} }
  const notes={}, files={};
  document.querySelectorAll("#modalRoot .note").forEach(n=>notes[n.dataset.i]=n.value.trim());
  document.querySelectorAll("#modalRoot .photo").forEach(p=>{ if(p.files[0]) files[p.dataset.i]=p.files[0]; });
  try{
    const ref=cRef().collection("checklistRuns").doc();
    const results=[];
    for(let i=0;i<tasks.length;i++){
      let photoUrl="";
      if(files[i]){ const path="companies/"+state.companyId+"/checklist/"+ref.id+"_"+i+".jpg"; photoUrl=await tryUploadImage(path,files[i]); }
      results.push({taskId:tasks[i].id,text:tasks[i].text,ok:!!vals[i],note:notes[i]||"",photoUrl});
    }
    const okCount=results.filter(r=>r.ok).length; const pct=Math.round(okCount/results.length*100);
    await ref.set({checklistId:id,checklistName:x.name,date:todayStr(),byUid:state.user.uid,byName:state.profile.name||state.user.email,
      results,pct,status:"submitted",at:now()});
    logAction("submit_checklist",x.name+" "+pct+"%");
    toast("تم حفظ التنفيذ","ok"); return true;
  }catch(e){console.error(e);toast("تعذّر الحفظ","err");return false;}
}

// عرض تنفيذ + اعتماد/رفض
function viewRunModal(clId,r){
  const rows=(r.results||[]).map(t=>"<div class='review-row'><span>"+(t.ok?"✅":"❌")+" "+esc(t.text)+(t.note?" — <span class='muted'>"+esc(t.note)+"</span>":"")+"</span>"+(t.photoUrl?"<a class='btn sm' href='"+t.photoUrl+"' target='_blank'>صورة</a>":"")+"</div>").join("");
  const canApprove=clCanManage()&&r.status==="submitted";
  openModal("تنفيذ "+esc(r.checklistName)+" — "+esc(r.date),
    "<div class='review-row'><span>المنفّذ</span><b>"+esc(r.byName)+"</b></div>"+
    "<div class='review-row'><span>نسبة الإنجاز</span><b>"+(r.pct||0)+"%</b></div>"+
    "<div style='margin:12px 0'>"+rows+"</div>",
    canApprove?"اعتماد":null, canApprove?async()=>{ await cRef().collection("checklistRuns").doc(r.id).update({status:"approved",reviewedBy:state.user.uid,reviewedAt:now()}); logAction("approve_checklist",r.checklistName); openPage("checklist"); return true; }:()=>true,
    !canApprove, 560);
  if(canApprove) setTimeout(()=>{ const foot=document.querySelector("#modalRoot .foot"); if(foot){ const rej=el("button","btn danger","رفض"); rej.onclick=async()=>{ await cRef().collection("checklistRuns").doc(r.id).update({status:"rejected",reviewedBy:state.user.uid,reviewedAt:now()}); logAction("reject_checklist",r.checklistName); closeModal(); openPage("checklist"); }; foot.appendChild(rej); } },40);

function renderAudit(container,ref,title,inline){
  if(title) container.innerHTML=pageTitle(title);
  if(window.__auditLimit==null) window.__auditLimit=10;
  // عدّاد عدد الظاهر
  const counter=pageSizeControl(window.__auditLimit,(n)=>{ window.__auditLimit=n; container.innerHTML=""; renderAudit(container,ref,title,inline); });
  container.appendChild(counter);
  const card=inline?el("div","card"):el("div","card");
  container.appendChild(card);
  card.innerHTML="<table><thead><tr><th>العملية</th><th>المستخدم</th><th>التفاصيل</th><th>الوقت</th></tr></thead><tbody id='auditRows'><tr><td colspan='4' class='muted'>جارٍ التحميل…</td></tr></tbody></table>";

function openModal(title,bodyHtml,okLabel,onOk,hideCancel,maxWidth){
  closeModal();
  const ov=el("div","overlay");
  ov.innerHTML="<div class='modal' style='max-width:"+(maxWidth||560)+"px'><div class='head'><h3>"+esc(L(title))+"</h3><button class='btn ghost sm' id='mClose'>✕</button></div><div class='body'>"+bodyHtml+"</div><div class='foot'>"+(okLabel?"<button class='btn primary' id='mOk'>"+esc(L(okLabel))+"</button>":"")+(hideCancel?"":"<button class='btn ghost' id='mCancel'>"+esc(L("إلغاء"))+"</button>")+"</div></div>";
  $("modalRoot").appendChild(ov);
  $("mClose").onclick=closeModal;
  if($("mCancel"))$("mCancel").onclick=closeModal;
  if($("mOk"))$("mOk").onclick=async()=>{const b=$("mOk");b.disabled=true;const keep=await onOk();b.disabled=false;if(keep!==false)closeModal();};
  ov.addEventListener("mousedown",e=>{if(e.target===ov)closeModal();});
  setTimeout(()=>translateTree(ov),0);
}

function currentRoleLetter(){ return state.role==="owner"||state.role==="super"?"o":state.role==="manager"?"m":"e"; }
function normalizeAr(s){ return (s||"").replace(/[أإآ]/g,"ا").replace(/[ةه]/g,"ه").replace(/[ىي]/g,"ي").replace(/[ًٌٍَُِّْ]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function openHelp(){
  const rl=currentRoleLetter();
  const list=FAQ.filter(f=>f.roles.includes(rl));
  const isEn=LANG==="en";
  const render=(items)=>items.map((f,i)=>{
    const q=isEn&&f.qen?f.qen:f.q, a=isEn&&f.aen?f.aen:f.a;
    return "<details style='margin-bottom:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px'><summary style='cursor:pointer;font-weight:600'>"+esc(q)+"</summary><p class='muted' style='margin-top:8px;line-height:1.8'>"+esc(a)+"</p></details>";
  }).join("");
  openModal(isEn?"Support":"الدعم الفني",
    "<input id='helpSearch' class='input' placeholder='"+(isEn?"Search your question…":"ابحث عن سؤالك…")+"' style='margin-bottom:12px'>"+
    "<div id='helpResults'>"+render(list)+"</div>"+
    "<p class='muted' style='font-size:12px;margin-top:12px'>"+(isEn?"Can't find an answer? Contact your company owner.":"ما لقيت جواب؟ تواصل مع صاحب الشركة.")+"</p>",
    null,()=>true,true,560);
  setTimeout(()=>{
    const inp=$("helpSearch"); if(!inp) return;
    inp.oninput=()=>{
      const term=normalizeAr(inp.value); const termEn=(inp.value||"").toLowerCase().trim();
      if(!term){ $("helpResults").innerHTML=render(list); translateTree($("helpResults")); return; }
      const found=list.filter(f=>{
        const hay=normalizeAr(f.q+" "+f.a)+" "+((f.qen||"")+" "+(f.aen||"")).toLowerCase();
        return term.split(" ").some(w=>w&&hay.includes(w)) || (termEn&&hay.includes(termEn));
      });
      $("helpResults").innerHTML=found.length?render(found):"<p class='muted'>"+(isEn?"No matching answer. Contact your company owner.":"ما فيه جواب مطابق. تواصل مع صاحب الشركة.")+"</p>";
    };
  },30);
}
window.openHelp=openHelp;

// نافذة ترحيب المالك عند أول دخول — إجبار تغيير كلمة المرور
function welcomeOwnerModal(companyName){
  // نافذة مخصّصة غير قابلة للإغلاق حتى تغيير الرمز
  const ov=el("div"); ov.id="welcomeOverlay";
  ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML=
    "<div class='card' style='max-width:460px;width:100%;text-align:center'>"+
      "<div style='font-size:40px;margin-bottom:6px'>🌿</div>"+
      "<h2 style='font-size:22px;margin-bottom:12px'>"+L("حيّاك الله ")+esc(companyName)+"</h2>"+
      "<p style='line-height:1.9;color:var(--muted);margin-bottom:8px'>نبارك لك الانضمام إلى عائلة <b>رُواق</b>، ونتشرّف بوجودك معنا. وحرصاً منّا على خصوصيتك، نرجو منك تغيير الرمز الخاص بك.</p>"+
      "<div style='text-align:start;margin-top:14px'>"+
        "<label class='field'><span>كلمة المرور الجديدة</span><input id='wcPass' class='input' type='password' autocomplete='new-password' placeholder='6 أحرف على الأقل'></label>"+
        "<div style='height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:-4px 0 4px'><div id='wcBar' style='height:100%;width:0;background:var(--red);transition:width .2s,background .2s'></div></div>"+
        "<div id='wcStrength' style='font-size:12px;color:var(--muted);min-height:16px;margin-bottom:8px'></div>"+
        "<label class='field'><span>تأكيد كلمة المرور</span><input id='wcPass2' class='input' type='password' autocomplete='new-password'></label>"+
      "</div>"+
      "<div id='wcErr' style='color:var(--red);font-size:13px;min-height:18px;margin:4px 0'></div>"+
      "<button class='btn primary' id='wcSave' style='width:100%'>حفظ ومتابعة</button>"+
    "</div>";
  document.body.appendChild(ov);
  // مؤشّر قوة كلمة المرور
  const pwScore=(p)=>{ let s=0; if(!p)return 0; if(p.length>=6)s++; if(p.length>=10)s++; if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++; if(/\d/.test(p))s++; if(/[^A-Za-z0-9]/.test(p))s++; return Math.min(s,5); };
  const wcInput=$("wcPass");
  if(wcInput) wcInput.oninput=()=>{
    const p=wcInput.value; const s=pwScore(p);
    const pct=[0,25,45,65,85,100][s];
    const info=[["","var(--line)"],["ضعيفة جداً","var(--red)"],["ضعيفة","var(--red)"],["متوسطة","var(--amber)"],["جيدة","#4a9d5b"],["قوية","var(--green)"]][s];
    const bar=$("wcBar"), lbl=$("wcStrength");
    if(bar){ bar.style.width=pct+"%"; bar.style.background=info[1]; }
    if(lbl){ lbl.textContent=p?("قوة كلمة المرور: "+info[0]):""; lbl.style.color=info[1]; }
  };
  $("wcSave").onclick=async ()=>{
    const p1=$("wcPass").value, p2=$("wcPass2").value; const err=$("wcErr");
    err.textContent="";
    if(p1.length<6){ err.textContent="كلمة المرور 6 أحرف على الأقل"; return; }
    if(p1!==p2){ err.textContent="كلمتا المرور غير متطابقتين"; return; }
    $("wcSave").disabled=true; $("wcSave").textContent="جارٍ الحفظ…";
    try{
      await auth.currentUser.updatePassword(p1);
      try{ await cRef().update({ownerWelcomed:true}); }catch(e){}
      logAction("owner_welcomed");
      ov.remove();
      toast("تم تغيير كلمة المرور، حيّاك الله 🌿","ok");
    }catch(e){
      $("wcSave").disabled=false; $("wcSave").textContent="حفظ ومتابعة";
      if(e && e.code==="auth/requires-recent-login"){
        err.textContent="لأمان حسابك، سجّل خروج ثم دخول وأعد المحاولة.";
      }else{
        err.textContent="تعذّر تغيير كلمة المرور. حاول مرة أخرى.";
      }
      console.error(e);
    }
  };
}

function currentIcons(){ try{ return localStorage.getItem("cafe_icons")||"color"; }catch(e){ return "color"; } }
function applyIcons(v){ document.documentElement.setAttribute("data-icons", v==="mono"?"mono":"color"); }
function setIcons(v){ try{localStorage.setItem("cafe_icons",v);}catch(e){} applyIcons(v); }
window.setIcons=setIcons;

(function initLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANGS.find(x=>x.k===LANG)||{}).dir||"rtl";
  applyLoginLang(); renderLangSwitchers();
})();
applyMode(currentMode());
applyIcons(currentIcons());
</script>
